<html lang="nl">

<meta name="mobile-web-app-capable" content="yes">

<title>Tom's Receptenboek</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: één kolom, mobiel eerst; zoekbalk bovenaan, ronde knop rechtsonder om toe te voegen */
:root {
  --bg: #F4F6F1;          /* licht, groen getint papier */
  --surface: #FFFFFF;
  --sunk: #E8ECE4;
  --ink: #18241D;
  --muted: #5F6D63;
  --line: #D5DCD0;
  --herb: #2F6B4F;        /* basilicumgroen: hoofdkleur */
  --herb-ink: #FFFFFF;
  --saffron: #E3A02F;     /* saffraan: accent voor favorieten en porties */
  --danger: #B3402E;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111814; --surface: #19221C; --sunk: #222D26; --ink: #E9EFE9; --muted: #9AAA9F;
    --line: #2E3A32; --herb: #6FB892; --herb-ink: #0D1611; --saffron: #F0B54E; --danger: #E5765F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111814; --surface: #19221C; --sunk: #222D26; --ink: #E9EFE9; --muted: #9AAA9F;
  --line: #2E3A32; --herb: #6FB892; --herb-ink: #0D1611; --saffron: #F0B54E; --danger: #E5765F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}
button, a, label, input, select, textarea { touch-action: manipulation; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 680px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 170px;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; text-wrap: balance; margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
input, textarea, select { font-size: max(16px, 1em); }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px; }
.muted { color: var(--muted); }
.label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Kop */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: grid; gap: 10px; padding-block: 12px 10px;
}
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { font-size: 28px; font-weight: 800; letter-spacing: -.01em; }
.iconbtn {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; flex: none;
}
.iconbtn svg { width: 20px; height: 20px; }
.search {
  display: flex; align-items: center; gap: 8px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 0 14px; height: 46px;
}
.search input { border: 0; background: transparent; flex: 1; min-width: 0; height: 100%; outline: none; font-size: 16px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 12px; font-size: 14px; font-weight: 600; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--herb); color: var(--herb-ink); border-color: var(--herb); }
.filterbar { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.filterbar::-webkit-scrollbar { display: none; }
@media (max-width: 460px) {
  .filterbar { gap: 6px; }
  .filterbar .fbtn { font-size: 13.5px; }
  .filterbar .fbtn:not(.star) { padding: 0 8px 0 10px; gap: 3px; }
  .filterbar .fbtn:not(.star) svg { width: 12px; height: 12px; }
  .filterbar .fbtn.star { width: 36px; }
}
@media (max-width: 380px) {
  .filterbar { gap: 4px; }
  .filterbar .fbtn:not(.star) { padding: 0 6px 0 9px; }
}
.fbtn {
  flex: none; display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px 0 14px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  font-size: 14px; font-weight: 600; white-space: nowrap; max-width: 60vw;
  flex: 0 1 auto; min-width: 0;
}
.fbtn .fl { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.fbtn svg { width: 14px; height: 14px; flex: none; opacity: .65; }
.fbtn[aria-pressed="true"] { background: var(--herb); color: var(--herb-ink); border-color: var(--herb); }
.fbtn[aria-pressed="true"] svg { opacity: 1; }
.fbtn.star { width: 38px; padding: 0; justify-content: center; color: var(--saffron); margin-left: auto; flex: none; }
.fbtn.star svg { width: 18px; height: 18px; opacity: 1; }
.fbtn.star[aria-pressed="true"] { background: var(--saffron); border-color: var(--saffron); color: #2A1C02; }
.avatar {
  --hue: 152; flex: none; display: inline-grid; place-items: center; border-radius: 50%; overflow: hidden;
  background: hsl(var(--hue) 38% 82%); color: hsl(var(--hue) 45% 24%); font-weight: 700; line-height: 1;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.emoji { line-height: 1; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 6px; }
.emoji-grid button { aspect-ratio: 1; border: 1px solid transparent; background: var(--sunk); border-radius: 12px; font-size: 26px; line-height: 1; padding: 0; }
.emoji-grid button[aria-pressed="true"] { border-color: var(--herb); background: var(--surface); box-shadow: 0 0 0 2px var(--herb); }
.emoji-own { display: flex; gap: 8px; align-items: center; }
.emoji-own .input { width: 70px; flex: none; text-align: center; font-size: 24px; padding: 6px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .avatar { background: hsl(var(--hue) 28% 30%); color: hsl(var(--hue) 50% 86%); } }
:root[data-theme="dark"] .avatar { background: hsl(var(--hue) 28% 30%); color: hsl(var(--hue) 50% 86%); }
.owner-dot { position: absolute; left: 8px; bottom: 8px; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface); display: grid; }
.byline-owner { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.owner-pick { display: flex; align-items: center; gap: 10px; }
.owner-pick select { flex: 1; min-width: 0; }
.profile-row { display: flex; align-items: center; gap: 16px; }
.members { list-style: none; margin: 0; padding: 0; display: grid; }
.members li { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.members li:last-child { border-bottom: 0; }
.members .n { margin-left: auto; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tabs.three { grid-template-columns: repeat(3, 1fr); }
/* Tabbalk onderin */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 7;
  display: grid; grid-template-columns: repeat(3, 1fr);
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.tab { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 4px 0; color: var(--muted); font-size: 12px; font-weight: 600; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--herb); }

/* Weekmenu */
.weeknav { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 8px; }
.weeklabel { display: grid; justify-items: center; line-height: 1.25; font-variant-numeric: tabular-nums; }
.weeklabel .muted { font-size: 14px; }
.iconbtn.flip svg { transform: scaleX(-1); }
.days { display: grid; gap: 12px; padding-top: 4px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; }
.day.today { border-color: var(--herb); box-shadow: inset 3px 0 0 var(--herb); }
.day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.day-head h2 { font-size: 17px; }
.day-head .muted { font-size: 13px; }
.meal { display: grid; grid-template-columns: minmax(0, 1fr) auto auto 32px; align-items: center; gap: 8px; }
.plan-with { display: flex; align-items: center; gap: 0; font-size: 14px; color: var(--muted); font-weight: 600; }
.plan-with .avatar { margin-right: -6px; box-shadow: 0 0 0 2px var(--bg); }
.plan-with span:last-child { margin-left: 14px; }
.plan-banner { display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; align-items: center; background: var(--surface); border: 1px solid var(--herb); border-radius: var(--r); padding: 12px 14px; }
.plan-banner-actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
.plan-banner-actions .btn { flex: 1 1 auto; min-height: 40px; }
.added-by { display: grid; }
/* Naast elkaar als er ruimte is (vanaf ~2 x 250px), anders onder elkaar */
.actions-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.actions-row .btn { flex: 1 1 250px; min-width: 0; min-height: 48px; padding: 10px 14px; line-height: 1.25; white-space: normal; text-align: left; justify-content: flex-start; }
.meal-open { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 0; text-align: left; min-width: 0; }
.meal-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini { width: 40px; height: 40px; border-radius: 10px; overflow: hidden; background: var(--sunk); display: grid; place-items: center; flex: none; color: var(--herb); }
.mini img { width: 100%; height: 100%; object-fit: cover; }
.servings.small button { width: 30px; height: 30px; font-size: 17px; }
.servings.small output { min-width: 30px; font-size: 14px; }
.x { width: 32px; height: 32px; border: 0; background: none; color: var(--muted); font-size: 22px; line-height: 1; }
.add-meal { justify-self: start; border: 1px dashed var(--line); background: none; color: var(--herb); font-weight: 600; border-radius: 10px; padding: 6px 12px; font-size: 14px; }
.menu-foot { display: grid; gap: 10px; margin-top: 8px; }
.pick { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 10px 0; text-align: left; }
.pick span:not(.mini) { display: grid; min-width: 0; }
.pick small { font-size: 13px; }
.pick-star { margin-left: auto; color: var(--saffron); width: 16px; height: 16px; display: grid !important; }
.daygrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.daygrid button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 0; display: grid; justify-items: center; line-height: 1.2; }
.daygrid small { font-size: 11px; color: var(--muted); white-space: nowrap; }
.daygrid b { font-size: 17px; font-variant-numeric: tabular-nums; }
.daygrid button[aria-pressed="true"] { background: var(--herb); border-color: var(--herb); color: var(--herb-ink); }
.daygrid button[aria-pressed="true"] small { color: inherit; }

/* Boodschappen */
.shop-list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 0 16px; }
.shop-item, .row-item { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: center; column-gap: 14px; min-height: 52px; padding: 6px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.row-item { grid-template-columns: minmax(0, 1fr) auto 32px; cursor: default; }
.shop-item:last-child, .row-item:last-child { border-bottom: 0; }
.shop-name { overflow-wrap: anywhere; line-height: 1.3; }
.shop-amt { text-align: right; }
.pantry-check { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.pantry-check > svg { width: 24px; height: 24px; color: var(--saffron); flex: none; }
.pantry-check span:not(.chev) { display: grid; gap: 2px; flex: 1; min-width: 0; }
.pantry-check small { font-size: 14px; }
.pantry-check .chev { font-size: 24px; color: var(--muted); line-height: 1; }
.hello { display: grid; gap: 2px; min-width: 0; }
.greet { margin: 0; font-size: 16px; font-weight: 600; color: var(--muted); }
.iconbtn:disabled { opacity: .35; }
.shop-item:last-child { border-bottom: 0; }
.shop-item input { width: 22px; height: 22px; margin: 0; accent-color: var(--herb); flex: none; }
.shop-name { flex: 1; min-width: 0; }
.shop-amt { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 15px; }
.shop-item.done .shop-name { text-decoration: line-through; color: var(--muted); }
.shop-item.editing { cursor: default; }
.rm-item { width: 24px; height: 24px; flex: none; border-radius: 50%; border: 0; background: var(--danger); color: #fff; font-size: 18px; font-weight: 700; line-height: 1; display: grid; place-items: center; padding: 0 0 2px; }
#shop-add { padding-right: 6px; }
#shop-add input { border: 0; background: transparent; flex: 1; min-width: 0; height: 100%; outline: none; font-size: 16px; }

/* Leden */
.invite-text { background: var(--sunk); border-radius: 12px; padding: 12px 14px; margin: 0; font-size: 15px; user-select: text; -webkit-user-select: text; }
.code.small { font-size: 15px; letter-spacing: .08em; flex: none; }
.member-row .member-name { flex: 1; min-width: 0; }
select.input.role-select { width: auto; flex: none; min-height: 38px; padding: 6px 8px; font-size: 16px; }
.member-row .member-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.danger-text { color: var(--danger) !important; }
.results { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 4px; min-height: 28px; }
.linkbtn { border: 0; background: none; color: var(--herb); font-weight: 600; font-size: 15px; padding: 4px 0; }
.results-actions { display: flex; align-items: center; gap: 14px; }
.surprise {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px 0 10px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  font-size: 14px; font-weight: 600; white-space: nowrap; color: inherit;
}
.surprise .die { font-size: 18px; line-height: 1; display: inline-block; }
.surprise.rolling .die { animation: roll .45s ease-in-out; }
@keyframes roll { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(200deg) scale(1.25); } 100% { transform: rotate(360deg) scale(1); } }
@media (prefers-reduced-motion: reduce) { .surprise.rolling .die { animation: none; } }
.sheet { animation: rise .22s ease-out; max-height: calc(var(--vvh, 100dvh) - 24px - env(safe-area-inset-top, 0px)); }
.sheet.dragging, .sheet.settle { animation: none; }
.sheet.dragging { transition: none; }
.sheet.settle { transition: transform .2s ease-out; }
@keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.grabber { width: 42px; height: 5px; border-radius: 3px; background: var(--muted); opacity: .45; margin: -8px auto 2px; position: relative; cursor: grab; touch-action: none; flex-shrink: 0; }
.sheet-head { touch-action: none; cursor: grab; }
.sheet-head button, .sheet-head a { cursor: pointer; }
.grabber::after { content: ""; position: absolute; inset: -14px -40px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-head h2 { font-size: 21px; }
.sheet > * { flex-shrink: 0; }
.sheet > .opts, .sheet > .sheet-scroll { flex: 0 1 auto; min-height: 90px; }
.opts { max-height: 52vh; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.sheet-scroll { overflow-y: auto; overscroll-behavior: contain; display: grid; gap: 12px; align-content: start; }
.opt { display: flex; align-items: center; gap: 14px; min-height: 50px; border-bottom: 1px solid var(--line); font-size: 16px; cursor: pointer; }
.opt:last-of-type { border-bottom: 0; }
.opt[hidden] { display: none; }
.sheet-search { height: 42px; background: var(--sunk); border-color: transparent; }
.sheet-search + .opts { min-height: 90px; }
.opt input { width: 21px; height: 21px; margin: 0; accent-color: var(--herb); flex: none; }
.opt .n { margin-left: auto; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.opt-group { margin: 16px 0 2px; }

/* Lijst */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin-top: 6px; }
.card { background: none; border: 0; padding: 0; text-align: left; display: grid; gap: 8px; min-width: 0; }
.thumb {
  aspect-ratio: 4 / 3; width: 100%; max-width: 100%; border-radius: var(--r); overflow: hidden;
  background: var(--sunk); display: grid; place-items: center; position: relative;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb .initial { font-family: var(--font-display); font-size: 44px; font-weight: 800; color: var(--herb); opacity: .55; }
.fav-dot { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--saffron); }
.fav-dot svg { width: 15px; height: 15px; }
.card h3 { font-size: 17px; font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { text-align: center; padding: 48px 16px; display: grid; gap: 10px; justify-items: center; }
.empty h2 { font-size: 22px; }

/* Ronde knop */
.fab {
  position: fixed; z-index: 6;
  right: calc(max(16px, env(safe-area-inset-right, 0px)) + 4px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 80px);
  height: 56px; padding: 0 22px 0 18px; border-radius: 999px; border: 0;
  background: var(--herb); color: var(--herb-ink); font-weight: 700; font-size: 16px;
  display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 20px rgb(0 0 0 / .18);
}
.fab svg { width: 22px; height: 22px; }

/* Knoppen en velden */
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px;
  min-height: 46px; padding: 0 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--herb); border-color: var(--herb); color: var(--herb-ink); }
.btn.danger { color: var(--danger); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .55; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 14px; font-weight: 600; }
.input, textarea.input, select.input {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px;
  padding: 11px 13px; font-size: 16px; min-height: 46px;
}
textarea.input { resize: vertical; line-height: 1.45; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; min-width: 0; }
.stack { display: grid; gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; }
.notice { border-radius: 12px; padding: 10px 14px; font-size: 14px; background: var(--sunk); }
.notice.error { color: var(--danger); }

/* Detail */
.back { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 12px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
.hero { aspect-ratio: 16 / 10; width: 100%; max-width: 100%; border-radius: var(--r); overflow: hidden; background: var(--sunk); display: grid; place-items: center; }
.hero img { width: 100%; height: 100%; object-fit: cover; }

/* ================= Hoeveelheden ================= */
const FRAC = { "½": .5, "⅓": 1 / 3, "⅔": 2 / 3, "¼": .25, "¾": .75, "⅛": .125 };
function parseAmount(text) {
  const raw = String(text || "").trim();
  const m = raw.match(/^(\d+(?:[.,]\d+)?)?\s*([½⅓⅔¼¾⅛])?\s*(?:-\s*\d+(?:[.,]\d+)?\s*)?(.*)$/);
  if (!m || (!m[1] && !m[2])) return { amount: null, unit: raw || null, original: raw };
  let v = m[1] ? parseFloat(m[1].replace(",", ".")) : 0;
  if (m[2]) v += FRAC[m[2]];
  return { amount: Math.round(v * 1000) / 1000, unit: m[3].trim() || null, original: raw };
}
function fmtAmount(v, unit) {
  if (v == null) return "";
  const u = (unit || "").toLowerCase();
  if (["g", "gr", "gram", "ml", "kg", "l", "cl", "dl"].includes(u) && v >= 10) {
    const r = v >= 100 ? Math.round(v / 5) * 5 : Math.round(v);
    return String(r);
  }
  const whole = Math.floor(v + 1e-9);
  const rest = v - whole;
  const opts = [[0, ""], [.25, "¼"], [1 / 3, "⅓"], [.5, "½"], [2 / 3, "⅔"], [.75, "¾"], [1, ""]];
  let best = opts[0];
  for (const o of opts) if (Math.abs(o[0] - rest) < Math.abs(best[0] - rest)) best = o;
  if (Math.abs(best[0] - rest) > .09) return String(Math.round(v * 10) / 10).replace(".", ",");
  const w = best[0] === 1 ? whole + 1 : whole;
  if (!best[1]) return String(w);
  return (w ? String(w) : "") + best[1];
}

/* ================= Recept uit Notes inlezen ================= */
const SECTIONS = [
  { key: "ing", re: /^(ingredi[eë]nten|ingredients|wat heb je nodig|je hebt nodig|benodigdheden|boodschappen(lijst)?)\b/i },
  { key: "steps", re: /^(bereidingswijze|bereiding|bereiden|werkwijze|instructies|zo maak je (het|dit)|aan de slag|stappen|method|instructions|directions)\b/i },
  { key: "tips", re: /^(kooktips|tips)\b/i },
];
const TAG_RULES = [
  ["kip", /\bkip|kippen/i], ["vlees", /gehakt|rund|varken|spek|ham\b|worst|lams/i],
  ["vis", /zalm|vis\b|kabeljauw|tonijn|garnal|pangasius|makreel/i],
  ["pasta", /orzo|pasta|spaghetti|penne|tagliatelle|fusilli|lasagne|gnocchi|macaroni/i],
  ["rijst", /rijst|risotto/i], ["noedels", /noedel|mie\b/i], ["curry", /curry/i], ["soep", /soep/i],
];
// Voorraadkast: wat het huishouden meestal in huis heeft. Aanpasbaar door de beheerder (Instellingen).
let PANTRY_GROUPS = [
  { group: "Olie en azijn", items: ["olijfolie", "zonnebloemolie", "sesamolie", "olie", "azijn", "wijnazijn", "balsamico", "rijstazijn"] },
  { group: "Sauzen", items: ["sojasaus", "ketjap", "sriracha", "sambal", "sweet chilisaus", "ketchup", "mayonaise", "mosterd", "oestersaus", "vissaus", "hoisinsaus", "worcestershiresaus", "tabasco", "tomatenpuree"] },
  { group: "Zaden en noten", items: ["sesamzaad", "pijnboompitten"] },
  { group: "Gedroogde kruiden", items: ["zout", "peper", "paprikapoeder", "kerrie", "komijn", "korianderpoeder", "kurkuma", "gemberpoeder", "garam masala", "oregano", "tijm", "rozemarijn", "italiaanse kruiden", "laurier", "kaneel", "nootmuskaat", "chilivlokken", "cayennepeper", "knoflookpoeder", "uienpoeder"] },
  { group: "Bakken", items: ["bloem", "suiker", "bruine suiker", "vanillesuiker", "honing", "bakpoeder", "baking soda", "maizena", "paneermeel"] },
  { group: "Overig", items: ["bouillonblokje", "roomboter", "boter", "margarine", "water"] },
];
let pantryRe = /$^/;
function buildPantryRe() {
  const words = [...new Set(PANTRY_GROUPS.flatMap((g) => g.items).map((w) => norm(w).trim()).filter(Boolean))]
    .sort((a, b) => b.length - a.length).map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  pantryRe = words.length ? new RegExp("(^|[^a-z])(" + words.join("|") + ")", "i") : /$^/;
}
function pantryCount() { return PANTRY_GROUPS.reduce((n, g) => n + g.items.length, 0); }
function isPantry(name) {
  const n = norm(name);
  if (/(^|\s)(groente|kippen|runder)?bouillon$/.test(n) || /bloemkool|(rode|groene|verse) peper/.test(n)) return false;
  return pantryRe.test(n);
}
buildPantryRe();
function suggestTags(r) {
  const tags = [...(r.tags || [])];
  const all = [r.title, r.subtitle, ...(r.ingredients || []).map((i) => i.name)].join(" ");
  for (const [tag, re] of TAG_RULES) if (re.test(all)) tags.push(tag);
  if (/\bbowl\b/i.test(r.title || "")) tags.push("bowl");
  if (!tags.some((t) => ["kip", "vlees", "vis"].includes(t))) tags.push("vegetarisch");
  return [...new Set(tags)];
}
function splitTitled(line) {
  const t = line.replace(/^\s*(?:[*•\-–]|\d+[.)])\s*/, "").trim();
  const m = t.match(/^([^:]{2,45}):\s+(.+)$/);
  return m ? { title: m[1].trim(), text: m[2].trim() } : { title: "", text: t };
}
function parseRecipeText(src) {
  const lines = String(src).replace(/\r/g, "").split("\n").map((l) => l.replace(/ /g, " ").trimEnd());
  const out = { title: "", subtitle: "", servings: 2, prep_time_minutes: null, ingredients: [], steps: [], tips: [], tags: [], source_url: "" };
  let section = "head";
  const warnings = [];
  const UNIT_WORD = /^(g|gr|gram|kg|ml|l|dl|cl|el|tl|eetlepels?|theelepels?|stuks?|tenen|teentjes?|teen|blikjes?|blik|zakjes?|snufje|snuf|bosjes?|bos|takjes?|cups?|tbsp|tsp)\.?$/i;
  for (const rawLine of lines) {
    // Opsommingstekens en emoji vooraan weghalen (komt veel voor op Instagram)
    const line = rawLine.trim().replace(/^[\p{Extended_Pictographic}\uFE0F\u200D*•·▪\-–✓✔]+\s*/u, "").trim();
    if (!line) continue;
    if (/^(#\S+\s*)+$/.test(line)) continue; // regel met alleen hashtags
    const url = line.match(/https?:\/\/\S+/);
    if (url) { out.source_url = url[0]; continue; }
    if (/-url$/i.test(line) || /^(bron|link|url)\s*:?$/i.test(line)) continue;
    const sec = SECTIONS.find((s) => s.re.test(line) && line.length < 40);
    if (sec) {
      section = sec.key;
      const sp = line.match(/(\d+)\s*(?:p\b|pers|personen)/i); if (sp && sec.key === "ing") out.servings = +sp[1];
      continue;
    }
    const time = line.match(/(\d+)\s*(?:min|minuten)\b/i);
    if (section === "head") {
      // Geen kopjes? Herken ingrediënten (begint met hoeveelheid) en genummerde stappen
      if (out.title && /^\d+[.)]\s+\S/.test(line)) { section = "steps"; out.steps.push(splitTitled(line.replace(/^\d+[.)]\s+/, ""))); continue; }
      if (out.title && /^(\d+(?:[.,]\d+)?|[½⅓⅔¼¾⅛])\s*\S/.test(line) && line.length < 60) section = "ing";
    }
    if (section === "head") {
      if (!out.title) out.title = line;
      else if (!out.subtitle) out.subtitle = line;
      if (time && !out.prep_time_minutes) out.prep_time_minutes = +time[1];
      continue;
    }
    if (section === "ing" && /^\d+[.)]\s+\S/.test(line) && line.length > 25) { section = "steps"; out.steps.push(splitTitled(line.replace(/^\d+[.)]\s+/, ""))); continue; }
    if (section === "ing") {
      const pm = line.match(/\((\d+)\s*p(?:ers(?:onen)?)?\)/i);
      if (/hoeveelheid/i.test(line)) { if (pm) out.servings = +pm[1]; continue; }
      let name, qty;
      const parts = line.split(/\t+|\s{2,}/).map((s) => s.trim()).filter(Boolean);
      // Hoeveelheid vooraan: "500 g gnocchi", "2 tenen knoflook", "1 ui"
      const lead = line.match(/^(\d+(?:[.,]\d+)?(?:\s*[-–]\s*\d+)?\s*[½⅓⅔¼¾⅛]?|[½⅓⅔¼¾⅛])\s+(\S+)\s*(.*)$/);
      if (lead && parts.length < 2) {
        if (lead[3] && UNIT_WORD.test(lead[2])) { qty = lead[1] + " " + lead[2]; name = lead[3]; }
        else { qty = lead[1]; name = (lead[2] + " " + lead[3]).trim(); }
        name = name.charAt(0).toUpperCase() + name.slice(1);
      }
      else if (parts.length >= 2) { qty = parts.pop(); name = parts.join(" "); }
      else {
        const m = line.match(/^(.*?)\s+(\d+(?:[.,]\d+)?\s*[½⅓⅔¼¾⅛]?\s*\S*|[½⅓⅔¼¾⅛]\s*\S*)$/);
        if (m) { name = m[1]; qty = m[2]; } else { name = line; qty = ""; }
      }
      const a = parseAmount(qty);
      const nm = name.replace(/^[*•\-–]\s*/, "");
      out.ingredients.push({ name: nm, amount: a.amount, unit: a.unit, original_text: a.original, is_pantry: isPantry(nm) });
      continue;
    }
    if (section === "steps") { out.steps.push(splitTitled(line.replace(/^(stap\s*)?\d+[.):]\s+/i, ""))); continue; }
    if (section === "tips") { out.tips.push(splitTitled(line)); continue; }
  }
  out.tags = suggestTags(out);
  if (!out.title) warnings.push("Geen titel gevonden: zet de naam van het gerecht op de eerste regel.");
  if (!out.ingredients.length) warnings.push("Geen ingrediënten gevonden: zet ze onder een kopje “Ingrediënten”.");
  if (!out.steps.length) warnings.push("Geen bereiding gevonden: zet de stappen onder een kopje “Bereidingswijze”.");
  const typos = [];
  for (const i of out.ingredients) if (/vierde olijfolie/i.test(i.name)) typos.push(`“${i.name}” bedoel je “extra vierge olijfolie”?`);
  out.warnings = warnings.concat(typos);
  return out;
}

/* ================= Foto verkleinen ================= */
function dataUrlToBlob(dataUrl) {
  const [head, b64] = dataUrl.split(",");
  const type = (head.match(/^data:([^;]+)/) || [])[1] || "image/jpeg";
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type });
}
async function shrinkPhoto(file) {
  const bmp = await createImageBitmap(file).catch(async () => {
    const url = URL.createObjectURL(file);
    const img = new Image(); img.src = url; await img.decode(); return img;
  });
  const max = 1600;
  const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  for (const q of [0.82, 0.72, 0.62, 0.5, 0.4]) {
    const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", q));
    if (blob && blob.size <= 480 * 1024) return blob;
  }
  throw new Error("Deze foto is te groot, ook na verkleinen. Kies een andere foto.");
}

Bereidingswijze
* Orzo bereiden: Bereid de bouillon. Verhit de olijfolie in een pan met deksel en fruit de rode ui, knoflook en het paprikapoeder 2 minuten. Voeg de orzo toe en roerbak 1 minuut. Schenk de bouillon erbij en kook de orzo, afgedekt, in 10 - 12 minuten droog.
* Kip bakken: Verhit de roomboter in een koekenpan en bak de kippendijreepjes in 6 - 8 minuten rondom goudbruin en gaar.
* Salade maken: Halveer de komkommer in de lengte en snijd in halve maantjes. Halveer de cherrytomaten. Meng beide in een kom met de olijfolie met balsamico. Breng op smaak met peper en zout.
* Yoghurtdressing: Snijd de munt fijn. Meng in een kleine kom de Griekse yoghurt met de helft van de munt en het sap van 1 citroenpartje per persoon.
* Serveren: Schep de orzo in diepe kommen. Verdeel de tomaat-komkommersalade en de kipreepjes erover. Werk af met de yoghurtdressing en de resterende munt.

Kooktips
* Orzo textuur: Orzo lijkt op rijst maar is een pasta. Als het te droog wordt voordat de korrel gaar is, voeg dan een extra scheutje water of bouillon toe.
* Smaakmaker: Citroen is de sleutel in dit gerecht. Het frisse zuur snijdt prachtig door de romige yoghurt en de kruidige kebabkip.

function isoDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function startOfWeek(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay() + 6) % 7; return addDays(x, -wd); }
function weekNumber(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 864e5 + 1) / 7);
}

let themeForced = false;
function applyTheme(t) {
  const root = document.documentElement;
  if (t === "light" || t === "dark") { root.setAttribute("data-theme", t); themeForced = true; }
  else if (themeForced) { root.removeAttribute("data-theme"); themeForced = false; }
  const dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", dark ? "#111814" : "#F4F6F1");
}

/* ================= 2. Wat kan ik maken? (op basis van wat je in huis hebt) ================= */
function stemTerm(t) {
  let x = norm(t).trim().replace(/\s+/g, " ");
  if (x.length > 5 && x.endsWith("en")) x = x.slice(0, -2);
  else if (x.length > 4 && /[^aeiouys]s$/.test(x)) x = x.slice(0, -1);
  return x.replace(/([aeou])\1([^aeiou])$/, "$1$2");
}
function termMatches(term, ingName) {
  const h = norm(ingName);
  return [...new Set([norm(term).trim(), stemTerm(term)])].filter(Boolean).some((v) =>
    v.length >= 4 ? h.includes(v) : new RegExp("(^|[^a-z])" + v.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).test(h));
}
function fridgeMatches() {
  const terms = S.fridge || [];
  if (!terms.length) return [];
  return S.recipes.map((r) => {
    const main = r.recipe_ingredients.filter((i) => !i.is_pantry);
    const have = main.filter((i) => terms.some((t) => termMatches(t, i.name)));
    const missing = main.filter((i) => !have.includes(i));
    return { r, main, have, missing };
  }).filter((m) => m.have.length).sort((a, b) => a.missing.length - b.missing.length || b.have.length - a.have.length || a.r.title.localeCompare(b.r.title, "nl"));
}
function fridgeSuggestions() {
  const count = new Map();
  for (const r of S.recipes) for (const i of r.recipe_ingredients) {
    if (i.is_pantry) continue;
    const n = String(i.name || "").replace(/\(.*?\)/g, "").trim().toLowerCase();
    if (n) count.set(n, (count.get(n) || 0) + 1);
  }
  const chosen = (S.fridge || []).map(norm);
  return [...count.entries()].filter(([n]) => !chosen.includes(norm(n))).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "nl")).slice(0, 16).map(([n]) => n);
}
function renderFridge() {
  S.fridge = S.fridge || [];
  $("#app").innerHTML = `
    <div class="back"><button class="iconbtn" id="back" aria-label="Terug">${ICON.back}</button><span class="label">Wat kan ik maken?</span><span style="width:40px"></span></div>

function drawFridge() {
  const box = $("#fridge"); if (!box) return;

  const names = (arr, n = 4) => esc(arr.slice(0, n).map((i) => i.name.toLowerCase()).join(", ")) + (arr.length > n ? ` +${arr.length - n}` : "");
  box.innerHTML = `

      <p class="muted" style="margin:0">Typ of tik aan wat er in je koelkast ligt. Dingen uit de voorraadkast tellen we al als in huis.</p></div>
    <form class="search" id="fr-add"><input id="fr-new" placeholder="Bijv. kip, courgette, rijst" autocomplete="off" autocapitalize="off" enterkeyhint="done"><button class="linkbtn">Toevoegen</button></form>
    ${S.fridge.length ? `<div class="stack" style="gap:8px"><div class="section-head"><p class="label" style="margin:0">In huis (${S.fridge.length})</p><button class="linkbtn" id="fr-clear">Alles wissen</button></div>
      <div class="chipwrap" id="fr-have">${S.fridge.map((t, k) => `<button class="chip have" data-rm="${k}" aria-label="${esc(t)} weghalen">${esc(t)}<b aria-hidden="true">×</b></button>`).join("")}</div></div>` : ""}
    ${sugg.length ? `<div class="stack" style="gap:8px"><p class="label" style="margin:0">Vaak in jullie recepten</p>
      <div class="chipwrap" id="fr-sugg">${sugg.map((t) => `<button class="chip sugg" data-add="${esc(t)}">+ ${esc(t)}</button>`).join("")}</div></div>` : ""}
    ${S.fridge.length ? `<div class="stack" style="gap:10px"><p class="label" style="margin:8px 0 0">${res.length ? `${res.length} ${res.length === 1 ? "recept past" : "recepten passen"}, beste eerst` : "Geen recepten gevonden"}</p>
      ${res.length ? res.map((m) => `<button class="match${m.missing.length ? "" : " full"}" data-id="${m.r.id}">${miniThumb(m.r)}<span>
        <h3>${esc(m.r.title)}${m.missing.length ? "" : `<span class="badge">Alles in huis</span>`}</h3>
        <span class="bar" aria-hidden="true"><i style="width:${Math.round((m.have.length / Math.max(1, m.main.length)) * 100)}%"></i></span>
        <small>${m.have.length} van ${m.main.length} in huis${m.r.prep_time_minutes ? " · " + timeText(m.r) : ""}</small>
        ${m.missing.length ? `<small>Nog nodig: <b>${names(m.missing)}</b></small>` : ""}</span></button>`).join("")
      : `<p class="muted" style="margin:0">Geen enkel recept gebruikt wat je gekozen hebt. Probeer een ander ingrediënt.</p>`}</div>`
    : `<div class="empty" style="padding:28px 8px"><p class="muted" style="margin:0">Kies hierboven een paar ingrediënten. Je ziet dan meteen welke recepten erbij passen, met wat je nog mist.</p></div>`}`;
  $("#fr-add").onsubmit = (e) => {
    e.preventDefault();
    const parts = $("#fr-new").value.split(/,|\+|\s+en\s+|\n/).map((x) => x.trim().toLowerCase()).filter(Boolean);
    for (const t of parts) if (!S.fridge.some((x) => norm(x) === norm(t))) S.fridge.push(t);
    drawFridge(); $("#fr-new").focus();
  };
  box.onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.rm != null) { S.fridge.splice(+b.dataset.rm, 1); drawFridge(); }
    else if (b.dataset.add) { S.fridge.push(b.dataset.add); drawFridge(); }
    else if (b.id === "fr-clear") { S.fridge = []; drawFridge(); }
    else if (b.dataset.id) go("detail", b.dataset.id);
  };
}

const STEPS_KEY = "receptenboek-stappen";
let STEPS = {};
try { STEPS = JSON.parse(sessionStorage.getItem(STEPS_KEY) || "{}"); } catch (_) { STEPS = {}; }
const stepSets = {};
function stepsDone(id) { if (!stepSets[id]) stepSets[id] = new Set(STEPS[id] || []); return stepSets[id]; }
function saveStepsDone() {
  for (const [id, set] of Object.entries(stepSets)) STEPS[id] = [...set];
  try { sessionStorage.setItem(STEPS_KEY, JSON.stringify(STEPS)); } catch (_) { /* alleen in geheugen */ }
}
function stepOrder(r) {
  const idx = r.steps.map((_, i) => i), done = stepsDone(r.id);
  return [...idx.filter((i) => !done.has(i)), ...idx.filter((i) => done.has(i))];
}

  $("#parse").onclick = async () => {

    const onlyUrl = txt.trim().match(/^(https?:\/\/\S+)$/i) || (txt.trim().split(/\s+/).length <= 3 && txt.match(/https?:\/\/\S+/i));
    if (onlyUrl) {
      const btn = $("#parse"), err = $("#paste-err");
      btn.disabled = true; btn.textContent = "Recept ophalen…"; err.hidden = true;
      try {
        let r = await store.importUrl((onlyUrl[1] || onlyUrl[0]).trim());
        if (r.fromText) {
          const p = parseRecipeText(r.fromText);
          r = { ...p, source_url: r.source_url, image: r.image, warnings: ["Uit de tekst onder de post gehaald. Controleer de ingrediënten en stappen even.", ...(p.warnings || [])] };
        }
        const d = { id: null, photo_path: null, photo_url: null, owner_id: S.user.id, warnings: [], ...r, tags: suggestTags(r) };
        d.ingredients = (d.ingredients || []).map((i) => ({ ...i, is_pantry: isPantry(i.name) }));
        delete d.image; delete d.image_url; delete d.description;

        }
        if (!d.ingredients.length) d.warnings.push("Er zijn geen ingrediënten gevonden. Vul ze zelf in of plak de tekst.");
        S.draft = d; S.view = "edit"; render(); window.scrollTo(0, 0);
      } catch (e) {
        btn.disabled = false; btn.textContent = "Inlezen";
        err.textContent = e.message; err.hidden = false;
      }
      return;
    }
    const p = parseRecipeText(txt);
    S.draft = { id: null, photo_path: null, photo_url: null, owner_id: S.user.id, ...p, ingredients: p.ingredients };
    S.view = "edit"; render(); window.scrollTo(0, 0);
  };
  $("#manual").onclick = () => { S.draft = emptyDraft(); S.view = "edit"; render(); };
  const sample = $("#sample"); if (sample) sample.onclick = () => { $("#paste").value = SAMPLE_TEXT.replace("Extra vierge", "Extra vierde"); };
  const sampleIg = $("#sample-ig"); if (sampleIg) sampleIg.onclick = () => { $("#paste").value = "https://www.instagram.com/p/voorbeeld-gnocchi/"; };
  const sampleLink = $("#sample-link"); if (sampleLink) sampleLink.onclick = () => { $("#paste").value = "https://www.hellofresh.nl/recipes/bowl-met-orzo-en-kippendijreepjes-628665bf439bffaaa70d603e"; };
}
function emptyDraft() {

            ${people().map(([id, n]) => `<option value="${esc(id)}" ${d.owner_id === id ? "selected" : ""}>${esc(n)}</option>`).join("")}

      <div class="section" style="margin-top:12px"><h2>Ingrediënten</h2>

    d.owner_id = $("#e-owner").value;
    d.servings = Math.max(1, parseInt($("#e-serv").value, 10) || 2);

    if (newTime !== d.prep_time_minutes) d.prep_time_estimated = false;

    d.source_url = $("#e-url").value.trim();
    d.ingredients = d.ingredients.map((_, k) => {
      const name = $(`#ing-name-${k}`).value.trim(), amtTxt = $(`#ing-amt-${k}`).value.trim(), unit = $(`#ing-unit-${k}`).value.trim();
      const a = parseAmount(amtTxt);
      return { name, amount: a.amount, unit: unit || null, original_text: [amtTxt, unit].filter(Boolean).join(" "), is_pantry: !!d.ingredients[k].is_pantry };
    });
    d.steps = d.steps.map((_, k) => ({ title: $(`#step-title-${k}`).value.trim(), text: $(`#step-text-${k}`).value.trim() }));
    d.tips = d.tips.map((_, k) => ({ title: $(`#tip-title-${k}`).value.trim(), text: $(`#tip-text-${k}`).value.trim() }));

  $("#add-step").onclick = () => { sync(); d.steps.push({ title: "", text: "" }); rerender(); };
  $("#add-tip").onclick = () => { sync(); d.tips.push({ title: "", text: "" }); rerender(); };
  $("#edit-form").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;

    for (const kind of ["ing", "step", "tip"]) {

    }
  });
  $("#e-owner").onchange = () => { sync(); rerender(); };
  $("#e-photo").onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;

    try { d.newPhoto = await shrinkPhoto(file); d.newPhotoUrl = URL.createObjectURL(d.newPhoto); d.removePhoto = false; rerender(); }
    catch (err) { toast(err.message); }
  };
  const rm = $("#rm-photo"); if (rm) rm.onclick = () => { sync(); d.newPhoto = null; d.newPhotoUrl = null; d.removePhoto = true; rerender(); };
  $("#edit-form").onsubmit = async (e) => {
    e.preventDefault(); sync();
    if (!d.title) { toast("Geef het gerecht een naam"); return; }
    const ingredients = d.ingredients.filter((i) => i.name);
    const steps = d.steps.filter((s) => s.text || s.title), tips = d.tips.filter((s) => s.text || s.title);
    const btn = $("#save"); btn.disabled = true; btn.textContent = "Bewaren…";

      const id = await store.saveRecipe(S.household.id, { ...d, steps, tips }, ingredients, d.newPhoto || null, !!(d.removePhoto && d.photo_path));

      S.draft = null; go("detail", id); toast("Recept bewaard");
    } catch (err) { btn.disabled = false; btn.textContent = "Bewaren"; toast(err.message); }
  };
}

function sheet(html, onClose) {
  const bg = document.createElement("div");
  bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grabber" aria-hidden="true"></div>${html}</div>`;
  let closed = false;
  const close = () => { if (closed) return; closed = true; document.removeEventListener("keydown", onKey); bg.remove(); if (onClose) onClose(); };
  enableSwipe(bg, close);
  const onKey = (e) => { if (e.key === "Escape") close(); };
  bg.addEventListener("click", (e) => { if (e.target === bg) close(); });
  document.addEventListener("keydown", onKey);
  document.body.appendChild(bg);
  return { el: bg, close };
}
function miniThumb(r) {
  return r && r.photo_url ? `<span class="mini"><img src="${esc(r.photo_url)}" alt=""></span>` : `<span class="mini"><b>${esc(((r && r.title) || "?")[0])}</b></span>`;
}
// Je kunt een week terugkijken; oudere weken worden elke nacht opgeruimd
function minWeek() { return addDays(startOfWeek(new Date()), -7); }
async function loadWeek() {
  const from = isoDate(S.weekStart), to = isoDate(addDays(S.weekStart, 6));
  S.meals = await store.mealPlan(from, to);
}
async function renderMenu() {
  $("#app").innerHTML = `<header class="top"><div class="brand"><h1>Weekmenu</h1></div></header><div class="spinner" aria-label="Laden"></div>${tabBarHTML("menu")}`;
  bindTabBar();
  try { await loadWeek(); } catch (e) { toast(e.message); }
  drawMenu();
}

              ${planPartners().length && m.user_id && m.user_id !== S.user.id ? `<span class="added-by" title="Gepland door ${esc(nameOf(m.user_id))}">${avatarHTML(m.user_id, 22)}</span>` : `<span></span>`}

              <div class="servings small" aria-label="Personen"><button data-dec="${m.id}" aria-label="Minder personen">−</button><output>${m.servings}p</output><button data-inc="${m.id}" aria-label="Meer personen">+</button></div>
              ${planPartners().length && m.user_id && m.user_id !== S.user.id ? `<span class="added-by" title="Gepland door ${esc(nameOf(m.user_id))}">${avatarHTML(m.user_id, 22)}</span>` : `<span></span>`}

        ${updatedHTML()}
        <p class="muted" style="margin:0;font-size:14px">${planPartners().length ? `Dit weekmenu, de boodschappenlijst en de favorieten deel je met ${esc(planPartners().map(nameOf).join(", "))}.` : "Je weekmenu is van jou alleen. Een huishouden vormen doe je bij Instellingen."}</p>

      const id = t.dataset.inc || t.dataset.dec || t.dataset.rm;

      else { const v = Math.min(20, Math.max(1, m.servings + (t.dataset.inc ? 1 : -1))); if (v === m.servings) return; m.servings = v; await store.updateMeal(id, { servings: v }); }

      [{ value: "week", label: `Week ${weekNumber(ws)} leegmaken`, sub: `${total} ${total === 1 ? "gerecht" : "gerechten"}`, danger: true }]);
    if (v !== "week") return;
    try { await store.removeMeals(S.meals.map((m) => m.id)); S.meals = []; drawMenu(); toast(`Week ${weekNumber(ws)} is leeggemaakt`); }
    catch (err) { toast(err.message); }
  };
}
function pickRecipeSheet(date) {
  const d = new Date(date + "T12:00:00");
  const sorted = S.recipes.slice().sort((a, b) => (S.favs.has(b.id) - S.favs.has(a.id)) || a.title.localeCompare(b.title, "nl"));
  const s = sheet(`
    <div class="sheet-head"><h2>${DAY_NAMES[(d.getDay() + 6) % 7]} ${fmtDay(d)}</h2></div>
    <form class="loose" id="loose-form">
      <b style="font-size:15px">Simpel gerecht, zonder recept</b>
      <div class="row2"><input class="input" id="loose-q" placeholder="Bijv. aardappels, kipfilet, broccoli" autocomplete="off" enterkeyhint="done"><button class="btn primary">Zet erop</button></div>
      <label class="check-line"><input type="checkbox" id="loose-list"> Ook op de boodschappenlijst zetten</label>
    </form>
    <p class="label" style="margin:2px 0 -4px">Of kies een recept</p>
    <label class="search">${ICON.search}<input id="pick-q" type="search" placeholder="Zoek een recept" autocomplete="off"></label>
    <div class="opts" id="pick-list"></div>`);
  $("#loose-form", s.el).onsubmit = async (e) => {
    e.preventDefault();
    const title = $("#loose-q", s.el).value.trim().replace(/\s+/g, " ");
    if (!title) { $("#loose-q", s.el).focus(); return; }
    const nice = title[0].toUpperCase() + title.slice(1);
    try {
      const m = await store.addMeal(S.household.id, date, null, 2, nice);
      let added = 0;
      if ($("#loose-list", s.el).checked) {
        const parts = nice.split(/,|\+|&|\s+en\s+|\s+met\s+/i).map((x) => x.trim()).filter(Boolean);

// Zet de ingrediënten van één recept op de lijst en tel ze op bij wat er al uit het weekmenu op staat
async function addRecipeToList(r, servings) {
  const items = aggregate([{ recipe_id: r.id, servings }]);
  S.shop = await store.shopping();
  const key = (n, u) => norm(n).replace(/\s+/g, " ").trim() + "|" + (u || "");
  const fresh = [];
  for (const it of items) {
    const ex = S.shop.find((x) => !x.is_checked && !x.is_manual && key(x.name, x.unit) === key(it.name, it.unit));
    if (ex && ex.amount != null && it.amount != null) {
      ex.amount = Math.round((ex.amount + it.amount) * 1000) / 1000;
      await store.updateShopping(ex.id, { amount: ex.amount });
    } else if (!ex) fresh.push({ name: it.name, amount: it.amount == null ? null : Math.round(it.amount * 1000) / 1000, unit: it.unit, is_manual: false, position: 0 });
  }
  if (fresh.length) S.shop.push(...(await store.addShopping(S.household.id, fresh)));
  return items.length;
}
const UNIT_NORM = { gram: "g", gr: "g", stuks: "stuk", "stuk(s)": "stuk", eetlepel: "el", theelepel: "tl", "zakje(s)": "zakje", zakjes: "zakje" };
function aggregate(meals, pantry = false) {
  const map = new Map();
  for (const m of meals) {
    const r = getRecipe(m.recipe_id); if (!r) continue;
    const f = (m.servings || r.servings || 2) / (r.servings || 2);
    for (const i of r.recipe_ingredients) {
      if (!!i.is_pantry !== pantry) continue;
      const unitRaw = (i.unit || "").trim().toLowerCase();
      const unit = UNIT_NORM[unitRaw] || unitRaw;
      const key = norm(i.name).replace(/\s+/g, " ").trim() + "|" + unit;
      const cur = map.get(key);
      const amt = i.amount == null ? null : i.amount * f;
      if (!cur) map.set(key, { name: i.name, unit: unit || null, amount: amt });
      else if (cur.amount != null && amt != null) cur.amount += amt;
      else if (cur.amount == null && amt != null) cur.amount = amt;
    }
  }
  return [...map.values()].sort((a, b) => a.name.localeCompare(b.name, "nl"));
}
async function makeShoppingList(weekStart = S.weekStart) {
  try {
    const meals = await store.mealPlan(isoDate(weekStart), isoDate(addDays(weekStart, 6)));
    if (!meals.length) { toast("Er staat nog niets op het weekmenu van die week"); return; }
    const items = aggregate(meals);
    try { localStorage.setItem(LIST_WEEK_KEY, isoDate(weekStart)); } catch (_) { /* niet erg */ }
    const current = await store.shopping();
    await store.removeShopping(current.filter((x) => !x.is_manual).map((x) => x.id));
    // Wat je zelf al op de lijst zette (bijv. met +) niet nog een keer toevoegen
    const k = (n) => norm(n).replace(/\s+/g, " ").trim();
    const manual = new Set(current.filter((x) => x.is_manual && !x.is_checked).map((x) => k(x.name)));
    const skipped = items.filter((i) => manual.has(k(i.name))).length;
    items.splice(0, items.length, ...items.filter((i) => !manual.has(k(i.name))));
    if (skipped) setTimeout(() => toast(`${skipped} ${skipped === 1 ? "product stond" : "producten stonden"} er al op en ${skipped === 1 ? "is" : "zijn"} niet dubbel toegevoegd`), 2700);
    await store.addShopping(S.household.id, items.map((i, k) => ({ name: i.name, amount: i.amount == null ? null : Math.round(i.amount * 1000) / 1000, unit: i.unit, is_manual: false, position: k + 1 })));
    toast(`Lijst gemaakt: ${items.length} producten uit ${meals.length} ${meals.length === 1 ? "gerecht" : "gerechten"}`);
    go("shop");
  } catch (err) { toast(err.message); }
}
const LIST_WEEK_KEY = "receptenboek-lijstweek";
function listWeek() {
  try { const v = localStorage.getItem(LIST_WEEK_KEY); if (v) return new Date(v + "T12:00:00"); } catch (_) { /* standaard */ }
  return startOfWeek(new Date());
}

      </form>
      ${invites.length ? `<div class="panel"><p class="label" style="margin:0">Openstaande uitnodigingen</p>
        <ul class="members">${invites.map((i) => `<li><span class="code small">${esc(i.code)}</span><span>${esc(i.name || "Zonder naam")}<small class="muted" style="display:block">${ROLE_LABEL[i.role]} · tot ${fmtDate(i.expires_at)}</small></span>
          <span class="n"><button class="linkbtn" data-show="${i.id}">Delen</button> · <button class="linkbtn danger-text" data-revoke="${i.id}">Intrekken</button></span></li>`).join("")}</ul></div>` : ""}
      <div class="panel"><p class="label" style="margin:0">Leden</p>
        <ul class="members">${members.sort((a, b) => nameOf(a.user_id).localeCompare(nameOf(b.user_id), "nl")).map((m) => `<li class="member-row">${avatarHTML(m.user_id, 36)}
          <span class="member-name">${esc(nameOf(m.user_id))}${m.user_id === S.user.id ? ' <span class="muted">(jij)</span>' : ""}</span>
          ${roleSelect(m.user_id, m.role)}
          ${m.user_id === S.user.id ? `<span style="width:32px"></span>` : `<button class="x" data-remove="${esc(m.user_id)}" aria-label="Verwijder ${esc(nameOf(m.user_id))}">×</button>`}</li>`).join("")}</ul>
        <p class="muted" style="margin:0;font-size:14px">${Object.entries(ROLE_HELP).map(([k, v]) => `<b>${ROLE_LABEL[k]}</b>: ${v.toLowerCase()}.`).join(" ")}</p></div>
    </div>`;
  $("#back").onclick = () => go("settings");
  $("#inv-role").onchange = (e) => { $("#inv-help").textContent = ROLE_HELP[e.target.value]; };
  $("#inv-form").onsubmit = async (e) => {
    e.preventDefault();
    try { const inv = await store.createInvite(S.household.id, $("#inv-name").value.trim(), $("#inv-role").value); await renderMembers(); showInvite(inv); }
    catch (err) { toast(err.message); }
  };
  $("#mv").onclick = async (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.show) showInvite(invites.find((i) => i.id === b.dataset.show));
    if (b.dataset.revoke) { try { await store.revokeInvite(b.dataset.revoke); toast("Uitnodiging ingetrokken"); renderMembers(); } catch (err) { toast(err.message); } }
    if (b.dataset.remove) {
      const id = b.dataset.remove;
      if (!(await confirmSheet(`${nameOf(id)} uit het receptenboek halen? Recepten van deze persoon blijven staan.`, "Verwijderen"))) return;
      try { await store.removeMember(id); toast(`${nameOf(id)} is verwijderd`); renderMembers(); } catch (err) { toast(err.message); }
    }
  };
  $("#mv").onchange = async (e) => {
    const sel = e.target.closest("[data-role-for]"); if (!sel || sel.id === "inv-role") return;
    const id = sel.dataset.roleFor;
    try {
      await store.setRole(id, sel.value);
      toast(`${nameOf(id)} is nu ${ROLE_LABEL[sel.value].toLowerCase()}`);
      if (id === S.user.id) { S.role = sel.value; if (!isAdmin()) return go("settings"); }
    } catch (err) { toast(/minstens/.test(err.message) ? "Er moet minstens één beheerder blijven." : err.message); renderMembers(); }
  };
}

/* ================= 4. Voorraadkast beheren ================= */
function pantrySheet() {
  const admin = isAdmin();
  let dirty = false;
  const body = () => `
    ${PANTRY_GROUPS.map((g, gi) => `<div class="pantry-group"><p class="label" style="margin:0">${esc(g.group)} (${g.items.length})</p>
      <div class="chipwrap">${g.items.map((w, wi) => `<span class="pantry-chip">${esc(w)}${admin ? `<button data-g="${gi}" data-w="${wi}" aria-label="${esc(w)} weghalen">×</button>` : ""}</span>`).join("") || `<span class="muted" style="font-size:14px">Leeg</span>`}</div></div>`).join("")}`;
  const s = sheet(`<div class="sheet-head"><h2>Voorraadkast</h2><span class="muted" style="font-size:14px" id="pt-n">${pantryCount()}</span></div>
    <p class="muted" style="margin:-6px 0 0;font-size:14px">${admin ? "Een woord telt ook binnen een langere naam: <b>sriracha</b> herkent ook ‘Sriracha saus’." : "Alleen de beheerder kan deze lijst aanpassen."}</p>
    <div class="sheet-scroll" id="pt-body">${body()}</div>
    ${admin ? `<form id="pt-add" class="stack" style="gap:8px">
      <div class="loose"><div class="row2"><input class="input" id="pt-new" placeholder="Bijv. kokosmelk" autocomplete="off" autocapitalize="off" enterkeyhint="done">
        <select class="input" id="pt-group" style="width:auto;flex:none;max-width:42%">${PANTRY_GROUPS.map((g, i) => `<option value="${i}">${esc(g.group)}</option>`).join("")}</select></div>
        <button class="btn primary">Toevoegen</button></div></form>
      <button class="btn block" id="pt-apply">Ook toepassen op bestaande recepten</button>` : `<button class="btn block" id="pt-close">Sluiten</button>`}`, async () => {
    if (dirty) { try { await store.savePantry(S.household.id, PANTRY_GROUPS); toast("Voorraadkast opgeslagen"); } catch (err) { toast(err.message); } }
  });
  const redraw = () => { buildPantryRe(); $("#pt-body", s.el).innerHTML = body(); $("#pt-n", s.el).textContent = pantryCount(); dirty = true; };
  $("#pt-body", s.el).onclick = (e) => {
    const b = e.target.closest("[data-g]"); if (!b) return;
    PANTRY_GROUPS[+b.dataset.g].items.splice(+b.dataset.w, 1); redraw();
  };
  if (!admin) { $("#pt-close", s.el).onclick = s.close; return; }
  $("#pt-add", s.el).onsubmit = (e) => {
    e.preventDefault();
    const words = $("#pt-new", s.el).value.split(",").map((x) => x.trim().toLowerCase()).filter(Boolean);
    if (!words.length) return;
    const g = PANTRY_GROUPS[+$("#pt-group", s.el).value];
    const fresh = words.filter((w) => !PANTRY_GROUPS.some((x) => x.items.some((y) => norm(y) === norm(w))));
    g.items.push(...fresh); g.items.sort((a, b) => a.localeCompare(b, "nl"));
    $("#pt-new", s.el).value = ""; redraw();
    toast(fresh.length ? `${fresh.join(", ")} toegevoegd aan ${g.group.toLowerCase()}` : "Staat er al in");
  };
  $("#pt-apply", s.el).onclick = async (e) => {
    const changes = [];
    let recs = 0;
    for (const r of S.recipes) {
      let changed = false;
      for (const i of r.recipe_ingredients) { const v = isPantry(i.name); if (!!i.is_pantry !== v) { changes.push({ id: i.id, is_pantry: v, ref: i }); changed = true; } }
      if (changed) recs++;
    }
    const n = changes.length;
    if (n && !(await confirmSheet(`${n} ${n === 1 ? "ingrediënt" : "ingrediënten"} in ${recs} ${recs === 1 ? "recept" : "recepten"} opnieuw indelen? Ook wat iemand met de hand naar of uit de voorraadkast heeft verplaatst.`, "Opnieuw indelen"))) return;
    const btn = e.currentTarget; btn.disabled = true;
    try { await store.setPantryFlags(changes); for (const c of changes) c.ref.is_pantry = c.is_pantry; }
    catch (err) { btn.disabled = false; toast(err.message); return; }
    btn.disabled = false;
    toast(n ? `${n} ${n === 1 ? "ingrediënt" : "ingrediënten"} opnieuw ingedeeld in ${recs} ${recs === 1 ? "recept" : "recepten"}` : "Alle recepten waren al goed ingedeeld");
  };
}

/* ================= Emoji in plaats van profielfoto ================= */
const EMOJIS = ["🍅", "🥑", "🍋", "🍓", "🫐", "🍑", "🥕", "🌶️", "🧄", "🥦", "🍄", "🌽", "🧀", "🥐", "🍕", "🍝", "🍜", "🍣", "🌮", "🥗", "🍳", "🥘", "🍰", "🍩", "☕", "🍷", "🌷", "🌻", "🌿", "🐻", "🦊", "🐼", "🐸", "🐙", "🦁", "🐝", "⭐", "🔥", "⚽", "🎸"];
function emojiSheet() {
  const cur = S.avatars?.[S.user.id]?.emoji || "";
  let pick = cur;
  const s = sheet(`<div class="sheet-head"><h2>Kies je emoji</h2><span id="em-prev">${avatarHTML(S.user.id, 40)}</span></div>
    <div class="sheet-scroll"><div class="emoji-grid" id="em-grid">${EMOJIS.map((e) => `<button data-e="${e}" aria-pressed="${e === cur}" aria-label="${e}">${e}</button>`).join("")}</div>
      <div class="emoji-own"><input class="input" id="em-own" maxlength="8" placeholder="🙂" autocomplete="off" value="${EMOJIS.includes(cur) ? "" : esc(cur)}"><span class="muted" style="font-size:14px">Of typ zelf een emoji met het emoji-toetsenbord</span></div></div>
    <button class="btn primary block" id="em-save">Opslaan</button>
    ${cur ? `<button class="btn block" id="em-none">Geen emoji, gewoon mijn voorletter</button>` : ""}`);
  const preview = () => {
    const keep = S.avatars[S.user.id]; S.avatars[S.user.id] = { ...(keep || {}), emoji: pick || null };
    $("#em-prev", s.el).innerHTML = avatarHTML(S.user.id, 40); S.avatars[S.user.id] = keep;
  };
  $("#em-grid", s.el).onclick = (e) => {
    const b = e.target.closest("[data-e]"); if (!b) return;
    pick = b.dataset.e; $("#em-own", s.el).value = "";
    for (const x of $("#em-grid", s.el).children) x.setAttribute("aria-pressed", x === b);
    preview();
  };
  $("#em-own", s.el).oninput = (e) => {
    const v = [...(e.target.value || "").trim()].slice(0, 4).join("");
    const one = (v.match(/\p{Extended_Pictographic}(\uFE0F|\u200D\p{Extended_Pictographic}|\p{Emoji_Modifier})*/u) || [""])[0];
    if (!one) return;
    pick = one;
    for (const x of $("#em-grid", s.el).children) x.setAttribute("aria-pressed", "false");
    preview();
  };
  const save = async (v) => {
    try {
      await store.setEmoji(S.user.id, v);
      S.avatars[S.user.id] = { ...(S.avatars[S.user.id] || {}), emoji: v || null, url: null };
      s.close(); toast(v ? "Emoji opgeslagen" : "Je voorletter wordt weer getoond"); renderSettings();
    } catch (err) { toast(err.message); }
  };
  $("#em-save", s.el).onclick = () => save(pick);
  const none = $("#em-none", s.el); if (none) none.onclick = () => save(null);
}

/* ================= Instellingen ================= */
function renderSettings() {
  const myName = S.names[S.user.id] || "";
  $("#app").innerHTML = `
    <div class="back"><button class="iconbtn" id="back" aria-label="Terug">${ICON.back}</button><span class="label">Instellingen</span><span style="width:40px"></span></div>
    <div class="stack">
      <div class="panel">
        <p class="label" style="margin:0">Jouw profiel</p>
        <div class="profile-row">${avatarHTML(S.user.id, 72)}
          <div class="stack" style="gap:8px;flex:1;min-width:0">
            <button class="btn" id="s-emoji">${S.avatars?.[S.user.id]?.emoji ? "Andere emoji" : "Kies je emoji"}</button>
            <p class="muted" style="margin:0;font-size:13px">Zo herkennen anderen jouw recepten en gerechten.</p>
          </div></div>
        <form id="name-form" class="stack" style="gap:10px"><label class="field"><span>Jouw naam bij recepten</span><input class="input" id="s-name" value="${esc(myName)}" required></label>
          <button class="btn">Naam opslaan</button></form>
      </div>
      <div class="panel"><p class="label" style="margin:0">Weergave</p>
        <div class="tabs three" role="radiogroup" aria-label="Weergave" id="theme">
          ${[["auto", "Automatisch"], ["light", "Licht"], ["dark", "Donker"]].map(([v, l]) => `<button role="radio" data-theme-opt="${v}" aria-selected="${getTheme() === v}" aria-checked="${getTheme() === v}">${l}</button>`).join("")}
        </div>
        <p class="muted" style="margin:0;font-size:14px">Automatisch volgt de instelling van je telefoon. Je keuze wordt op dit toestel onthouden.</p></div>
      <div class="panel"><p class="label" style="margin:0">Voorraadkast</p>
        <p class="muted" style="margin:0;font-size:14px">${pantryCount()} dingen die jullie meestal in huis hebben, zoals sauzen en kruiden. Die komen niet vanzelf op de boodschappenlijst, en bij <b>Wat kan ik maken?</b> tellen ze als in huis.</p>
        <button class="btn" id="to-pantry">${isAdmin() ? "Voorraadkast aanpassen" : "Bekijk de lijst"}</button></div>
      <div class="panel" id="plan-panel"><p class="label" style="margin:0">Jouw huishouden</p>
        ${planRequestBanner()}
        ${planPartners().length ? `<div class="plan-with">${[S.user.id, ...planPartners()].map((id) => avatarHTML(id, 30)).join("")}<span>${esc(planWithText())}</span></div>
          <p class="muted" style="margin:0;font-size:14px">Jullie delen het weekmenu, de boodschappenlijst en favorieten, zolang jullie samen een huishouden zijn. Recepten zijn voor het hele receptenboek.</p>
          <button class="btn" id="plan-leave">Huishouden verlaten</button>`
        : `<p class="muted" style="margin:0;font-size:14px">Woon je samen? Vorm een huishouden met iemand uit het receptenboek. Jullie delen dan voor altijd één weekmenu, boodschappenlijst en favorieten. Die persoon moet het eerst accepteren.</p>`}
        <ul class="members">${Object.keys(S.names).filter((id) => id !== S.user.id && S.roles[id] && !planPartners().includes(id) && !((S.plan && S.plan.incoming) || []).includes(id)).sort((a, b) => nameOf(a).localeCompare(nameOf(b), "nl")).map((id) => {
          const pending = ((S.plan && S.plan.outgoing) || []).includes(id);
          return `<li>${avatarHTML(id, 32)}<span>${esc(nameOf(id))}</span><span class="n">${pending ? `<span class="muted">Gevraagd</span> · <button class="linkbtn danger-text" data-cancel="${esc(id)}">Intrekken</button>` : `<button class="linkbtn" data-ask="${esc(id)}">Vraag voor huishouden</button>`}</span></li>`;
        }).join("")}</ul></div>
      <div class="panel"><p class="label" style="margin:0">In ${esc(S.household.name || APP_NAME)}</p>
        <ul class="members">${Object.keys(S.names).filter((id) => S.roles[id]).sort((a, b) => (a === S.user.id ? -1 : b === S.user.id ? 1 : nameOf(a).localeCompare(nameOf(b), "nl"))).map((id) => `<li>${avatarHTML(id, 36)}<span>${esc(nameOf(id))}${id === S.user.id ? ' <span class="muted">(jij)</span>' : ""}<small class="muted" style="display:block">${ROLE_LABEL[S.roles[id]] || ""}</small></span><span class="n">${((n) => n === 1 ? "1 recept" : n + " recepten")(S.recipes.filter((r) => ownerOf(r) === id).length)}</span></li>`).join("")}</ul>
        ${isAdmin() ? `<button class="btn" id="to-members">Leden en uitnodigingen beheren</button>` : `<p class="muted" style="margin:0;font-size:14px">Jij bent ${esc((ROLE_LABEL[S.role] || "").toLowerCase())}: ${esc((ROLE_HELP[S.role] || "").toLowerCase())}.</p>`}</div>
      <button class="btn" id="logout">Uitloggen</button>
    </div>`;
  $("#theme").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    setTheme(b.dataset.themeOpt);
    for (const x of $("#theme").children) { const on = x === b; x.setAttribute("aria-selected", on); x.setAttribute("aria-checked", on); }
  };
  $("#s-emoji").onclick = () => emojiSheet();
  $("#back").onclick = () => go("list");
  if ($("#to-members")) $("#to-members").onclick = () => go("members");
  $("#to-pantry").onclick = () => pantrySheet();
  $("#plan-panel").onclick = async (e) => {
    if (await handlePlanBanner(e, renderSettings)) return;
    const b = e.target.closest("button"); if (!b) return;
    try {
      if (b.dataset.ask) { await store.requestPlan(b.dataset.ask); toast(`Gevraagd aan ${nameOf(b.dataset.ask)}. Zodra die accepteert, delen jullie een huishouden.`); }
      else if (b.dataset.cancel) { await store.declinePlan(S.user.id, b.dataset.cancel); toast("Verzoek ingetrokken"); }
      else if (b.id === "plan-leave") {
        if (!(await confirmSheet("Het huishouden verlaten? Je neemt je eigen gerechten, boodschappen en favorieten mee.", "Stoppen"))) return;
        await store.leavePlan(); toast("Je hebt het huishouden verlaten");
      } else return;
      S.plan = await store.planInfo(S.user.id); S.favs = new Set(await store.favorites()); renderSettings();
    } catch (err) { toast(err.message); }
  };
  $("#name-form").onsubmit = async (e) => {
    e.preventDefault();
    try { const n = $("#s-name").value.trim(); await store.updateName(S.user.id, n); S.names[S.user.id] = n; toast("Naam opgeslagen"); renderSettings(); }
    catch (err) { toast(err.message); }
  };
  $("#logout").onclick = async () => { await store.signOut(); if (!store.demo) { S.user = null; renderAuth(); } };
}

// Uitnodigingslink: ?code=XXXX invullen bij "Account maken", en de code uit de adresbalk halen
try {
  const c = new URLSearchParams(location.search).get("code");
  if (c) { S.inviteCode = c.trim().toUpperCase(); history.replaceState(null, "", location.pathname + location.hash); }
} catch (_) { /* geen code */ }
if (store.onAuth) store.onAuth((s) => { if (!s && S.user && !store.demo) { S.user = null; renderAuth(); } });
boot().catch(renderError);
</script>
