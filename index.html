<style>
/* Layout: één kolom, mobiel eerst; zoekbalk bovenaan, ronde knop rechtsonder om toe te voegen */
/* Redesign "Boterzacht": 60% Butter Cream, 30% Forest Green, 10% Mandarijn. Donker: Nachtgroen, Butter Cream, Mandarijn. */
:root {
  --bg: #F6ECD9;          /* Butter Cream */
  --surface: #FFFBF2;
  --sunk: #EADDC3;
  --ink: #1F3A2E;         /* Forest Green */
  --muted: #566257;
  --line: #E3D5B8;
  --line2: #D8C9A8;
  --herb: #1F3A2E;        /* sterk vlak: actieve knoppen, "Vanavond"-kaart (donker: crème) */
  --herb-ink: #F6ECD9;
  --saffron: #FF7A1A;     /* Mandarijn: accent voor favorieten, vandaag, voortgang */
  --acc: #FF7A1A;
  --acc-ink: #14251D;
  --hero: #1F3A2E;
  --hero-btn: #F6ECD9;
  --hero-btn-ink: #1F3A2E;
  --strong-muted: #C9D3C4;
  --letter: #A8997A;
  --danger: #B3402E;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "DM Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101F18; --surface: #182C23; --sunk: #1D3328; --ink: #F6ECD9; --muted: #A9B5A6;
    --line: #2A4335; --line2: #3F5C4C; --herb: #F6ECD9; --herb-ink: #1F3A2E; --hero: #0A1510; --hero-btn: #182C23; --hero-btn-ink: #F6ECD9; --strong-muted: #566257; --letter: #6F8275; --danger: #E5765F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101F18; --surface: #182C23; --sunk: #1D3328; --ink: #F6ECD9; --muted: #A9B5A6;
    --line: #2A4335; --line2: #3F5C4C; --herb: #F6ECD9; --herb-ink: #1F3A2E; --hero: #0A1510; --hero-btn: #182C23; --hero-btn-ink: #F6ECD9; --strong-muted: #566257; --letter: #6F8275; --danger: #E5765F;
    color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}
button, a, label, input, select, textarea { touch-action: manipulation; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 680px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 170px;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; text-wrap: balance; margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
input, textarea, select { font-size: max(16px, 1em); }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px; }
.muted { color: var(--muted); }
.label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Kop */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: grid; gap: 10px; padding-block: 12px 10px;
}
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { font-size: 28px; font-weight: 800; letter-spacing: -.01em; }
.iconbtn {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; flex: none;
}
.iconbtn svg { width: 20px; height: 20px; }
.search {
  display: flex; align-items: center; gap: 8px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 0 14px; height: 46px;
}
.search input { border: 0; background: transparent; flex: 1; min-width: 0; height: 100%; outline: none; font-size: 16px; }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; display: none; }
.search .clear { flex: none; width: 26px; height: 26px; margin-right: -6px; border: 0; border-radius: 50%; background: var(--sunk); color: var(--muted); display: grid; place-items: center; padding: 0; }
.search .clear svg { width: 12px; height: 12px; }
.search .clear[hidden] { display: none; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 12px; font-size: 14px; font-weight: 600; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--herb); color: var(--herb-ink); border-color: var(--herb); }
.filterbar { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.filterbar::-webkit-scrollbar { display: none; }
@media (max-width: 460px) {
  .filterbar { gap: 6px; }
  .filterbar .fbtn { font-size: 13.5px; }
  .filterbar .fbtn:not(.star) { padding: 0 8px 0 10px; gap: 3px; }
  .filterbar .fbtn:not(.star) svg { width: 12px; height: 12px; }
  .filterbar .fbtn.star { width: 36px; }
}
@media (max-width: 380px) {
  .filterbar { gap: 4px; }
  .filterbar .fbtn:not(.star) { padding: 0 6px 0 9px; }
}
.fbtn {
  flex: none; display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px 0 14px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  font-size: 14px; font-weight: 600; white-space: nowrap; max-width: 60vw;
  flex: 0 1 auto; min-width: 0;
}
.fbtn .fl { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.fbtn svg { width: 14px; height: 14px; flex: none; opacity: .65; }
.fbtn[aria-pressed="true"] { background: var(--herb); color: var(--herb-ink); border-color: var(--herb); }
.fbtn[aria-pressed="true"] svg { opacity: 1; }
.fbtn.star { width: 38px; padding: 0; justify-content: center; color: var(--saffron); margin-left: auto; flex: none; }
.fbtn.star svg { width: 18px; height: 18px; opacity: 1; }
.fbtn.star[aria-pressed="true"] { background: var(--saffron); border-color: var(--saffron); color: #2A1C02; }
.avatar {
  --hue: 152; flex: none; display: inline-grid; place-items: center; border-radius: 50%; overflow: hidden;
  background: hsl(var(--hue) 38% 82%); color: hsl(var(--hue) 45% 24%); font-weight: 700; line-height: 1;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.emoji { line-height: 1; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 6px; }
.emoji-grid button { aspect-ratio: 1; border: 1px solid transparent; background: var(--sunk); border-radius: 12px; font-size: 26px; line-height: 1; padding: 0; }
.emoji-grid button[aria-pressed="true"] { border-color: var(--herb); background: var(--surface); box-shadow: 0 0 0 2px var(--herb); }
.emoji-own { display: flex; gap: 8px; align-items: center; }
.emoji-own .input { width: 70px; flex: none; text-align: center; font-size: 24px; padding: 6px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .avatar { background: hsl(var(--hue) 28% 30%); color: hsl(var(--hue) 50% 86%); } }
:root[data-theme="dark"] .avatar { background: hsl(var(--hue) 28% 30%); color: hsl(var(--hue) 50% 86%); }
.owner-dot { position: absolute; left: 8px; bottom: 8px; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface); display: grid; }
.byline-owner { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.owner-pick { display: flex; align-items: center; gap: 10px; }
.owner-pick select { flex: 1; min-width: 0; }
.profile-row { display: flex; align-items: center; gap: 16px; }
.members { list-style: none; margin: 0; padding: 0; display: grid; }
.members li { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.members li:last-child { border-bottom: 0; }
.members .n { margin-left: auto; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tabs.three { grid-template-columns: repeat(3, 1fr); }
/* Tabbalk onderin */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 7;
  display: grid; grid-template-columns: repeat(var(--tabs, 3), 1fr);
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.tab { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 4px 0; color: var(--muted); font-size: 12px; font-weight: 600; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--herb); }

/* Weekmenu */
.weeknav { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 8px; }
.weeklabel { display: grid; justify-items: center; line-height: 1.25; font-variant-numeric: tabular-nums; }
.weeklabel .muted { font-size: 14px; }
.iconbtn.flip svg { transform: scaleX(-1); }
.days { display: grid; gap: 12px; padding-top: 4px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; }
.day.today { border-color: var(--herb); box-shadow: inset 3px 0 0 var(--herb); }
.day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.day-head h2 { font-size: 17px; }
.day-head .muted { font-size: 13px; }
.meal { display: grid; grid-template-columns: minmax(0, 1fr) auto auto 32px; align-items: center; gap: 8px; }
.plan-with { display: flex; align-items: center; gap: 0; font-size: 14px; color: var(--muted); font-weight: 600; }
.plan-with .avatar { margin-right: -6px; box-shadow: 0 0 0 2px var(--bg); }
.plan-with span:last-child { margin-left: 14px; }
.plan-banner { display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; align-items: center; background: var(--surface); border: 1px solid var(--herb); border-radius: var(--r); padding: 12px 14px; }
.plan-banner-actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
.plan-banner-actions .btn { flex: 1 1 auto; min-height: 40px; }
.added-by { display: grid; }
/* Naast elkaar als er ruimte is (vanaf ~2 x 250px), anders onder elkaar */
.actions-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.actions-row .btn { flex: 1 1 250px; min-width: 0; min-height: 48px; padding: 10px 14px; line-height: 1.25; white-space: normal; text-align: left; justify-content: flex-start; }
.meal-open { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 0; text-align: left; min-width: 0; }
.meal-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini { width: 40px; height: 40px; border-radius: 10px; overflow: hidden; background: var(--sunk); display: grid; place-items: center; flex: none; color: var(--herb); }
.mini img { width: 100%; height: 100%; object-fit: cover; }
.servings.small button { width: 30px; height: 30px; font-size: 17px; }
.servings.small output { min-width: 30px; font-size: 14px; }
.x { width: 32px; height: 32px; border: 0; background: none; color: var(--muted); font-size: 22px; line-height: 1; }
.add-meal { justify-self: start; border: 1px dashed var(--line); background: none; color: var(--herb); font-weight: 600; border-radius: 10px; padding: 6px 12px; font-size: 14px; }
.menu-foot { display: grid; gap: 10px; margin-top: 8px; }
.pick { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 10px 0; text-align: left; }
.pick span:not(.mini) { display: grid; min-width: 0; }
.pick small { font-size: 13px; }
.pick-star { margin-left: auto; color: var(--saffron); width: 16px; height: 16px; display: grid !important; }
.daygrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.daygrid button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 0; display: grid; justify-items: center; line-height: 1.2; }
.daygrid small { font-size: 11px; color: var(--muted); white-space: nowrap; }
.daygrid b { font-size: 17px; font-variant-numeric: tabular-nums; }
.daygrid button[aria-pressed="true"] { background: var(--herb); border-color: var(--herb); color: var(--herb-ink); }
.daygrid button[aria-pressed="true"] small { color: inherit; }

/* Boodschappen */
.shop-list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 0 16px; }
.shop-item, .row-item { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: center; column-gap: 14px; min-height: 52px; padding: 6px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.row-item { grid-template-columns: minmax(0, 1fr) auto 32px; cursor: default; }
.shop-item:last-child, .row-item:last-child { border-bottom: 0; }
.shop-name { overflow-wrap: anywhere; line-height: 1.3; }
.shop-amt { text-align: right; }
.pantry-check { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.pantry-check > svg { width: 24px; height: 24px; color: var(--saffron); flex: none; }
.pantry-check span:not(.chev) { display: grid; gap: 2px; flex: 1; min-width: 0; }
.pantry-check small { font-size: 14px; }
.pantry-check .chev { font-size: 24px; color: var(--muted); line-height: 1; }
.hello { display: grid; gap: 2px; min-width: 0; }
.greet { margin: 0; font-size: 16px; font-weight: 600; color: var(--muted); }
.iconbtn:disabled { opacity: .35; }
.shop-item:last-child { border-bottom: 0; }
.shop-item input { width: 22px; height: 22px; margin: 0; accent-color: var(--herb); flex: none; }
.shop-name { flex: 1; min-width: 0; }
.shop-amt { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 15px; }
.shop-item.done .shop-name { text-decoration: line-through; color: var(--muted); }
.shop-item.editing { cursor: default; }
.shop-item { cursor: default; }
.shop-item .chk { display: grid; place-items: center; width: 44px; height: 44px; margin: -10px -10px -10px -10px; cursor: pointer; }
.amt-link { border: 0; background: none; padding: 8px 0 8px 12px; margin: -8px 0; font: inherit; min-height: 40px; cursor: pointer; }
.amt-link:active { color: var(--ink); }
.rm-item { width: 24px; height: 24px; flex: none; border-radius: 50%; border: 0; background: var(--danger); color: #fff; font-size: 18px; font-weight: 700; line-height: 1; display: grid; place-items: center; padding: 0 0 2px; }
#shop-add { padding-right: 6px; }
.add-opts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: -2px; }
.add-opts .amt-btn { font-size: 14px; min-height: 34px; padding: 5px 12px; }
.add-opts .amt-btn.ask { border-color: var(--acc); color: var(--ink); background: color-mix(in srgb, var(--acc) 14%, var(--surface)); }
#shop-add input { border: 0; background: transparent; flex: 1; min-width: 0; height: 100%; outline: none; font-size: 16px; }

/* Leden */
.invite-text { background: var(--sunk); border-radius: 12px; padding: 12px 14px; margin: 0; font-size: 15px; user-select: text; -webkit-user-select: text; }
.code.small { font-size: 15px; letter-spacing: .08em; flex: none; }
.member-row .member-name { flex: 1; min-width: 0; }
select.input.role-select { width: auto; flex: none; min-height: 38px; padding: 6px 8px; font-size: 16px; }
.member-row .member-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.danger-text { color: var(--danger) !important; }
.results { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 4px; min-height: 28px; }
.results { flex-wrap: wrap; row-gap: 8px; }
.results .label, .results .linkbtn { white-space: nowrap; }
.results-actions { margin-left: auto; }
.results-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.sortbtn { display: inline-grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 50%; color: var(--herb); flex: none; }
.sortbtn svg { width: 17px; height: 17px; }
.sortbtn[aria-pressed="true"] { background: var(--herb); border-color: var(--herb); color: var(--herb-ink); }
.linkbtn { border: 0; background: none; color: var(--herb); font-weight: 600; font-size: 15px; padding: 4px 0; }
.results-actions { display: flex; align-items: center; gap: 14px; }
.surprise {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px 0 10px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  font-size: 14px; font-weight: 600; white-space: nowrap; color: inherit;
}
.surprise .die { font-size: 18px; line-height: 1; display: inline-block; }
.surprise.rolling .die { animation: roll .45s ease-in-out; }
@keyframes roll { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(200deg) scale(1.25); } 100% { transform: rotate(360deg) scale(1); } }
@media (prefers-reduced-motion: reduce) { .surprise.rolling .die { animation: none; } }
.sheet { animation: rise .22s ease-out; max-height: calc(var(--vvh, 100dvh) - 24px - env(safe-area-inset-top, 0px)); }
.sheet.dragging, .sheet.settle { animation: none; }
.sheet.dragging { transition: none; }
.sheet.settle { transition: transform .2s ease-out; }
@keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.grabber { width: 42px; height: 5px; border-radius: 3px; background: var(--muted); opacity: .45; margin: -8px auto 2px; position: relative; cursor: grab; touch-action: none; flex-shrink: 0; }
.sheet-head { touch-action: none; cursor: grab; }
.sheet-head button, .sheet-head a { cursor: pointer; }
.grabber::after { content: ""; position: absolute; inset: -14px -40px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-head h2 { font-size: 21px; }
.sheet > * { flex-shrink: 0; }
.sheet > .opts, .sheet > .sheet-scroll { flex: 0 1 auto; min-height: 90px; }
.opts { touch-action: pan-y; max-height: 52vh; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.sheet-scroll { touch-action: pan-y; overflow-y: auto; overscroll-behavior: contain; display: grid; gap: 12px; align-content: start; }
.opt { display: flex; align-items: center; gap: 14px; min-height: 50px; border-bottom: 1px solid var(--line); font-size: 16px; cursor: pointer; }
.opt:last-of-type { border-bottom: 0; }
.opt[hidden] { display: none; }
.sheet-search { height: 42px; background: var(--sunk); border-color: transparent; }
.sheet-search + .opts { min-height: 90px; }
.opt input { width: 21px; height: 21px; margin: 0; accent-color: var(--herb); flex: none; }
.opt .n { margin-left: auto; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.opt-group { margin: 16px 0 2px; }

/* Lijst */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin-top: 6px; }
.card { background: none; border: 0; padding: 0; text-align: left; display: grid; gap: 8px; min-width: 0; align-content: start; grid-template-rows: auto auto auto; }
.thumb {
  aspect-ratio: 4 / 3; width: 100%; max-width: 100%; border-radius: var(--r); overflow: hidden;
  background: var(--sunk); display: grid; place-items: center; position: relative;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb .initial { font-family: var(--font-display); font-size: 44px; font-weight: 800; color: var(--herb); opacity: .55; }
.fav-dot { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--saffron); }
.fav-dot svg { width: 15px; height: 15px; }
.card h3 { font-size: 17px; font-weight: 600; line-height: 1.25; min-height: 2.5em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .meta { flex-wrap: nowrap; white-space: nowrap; overflow: hidden; gap: 0; }
.card .meta span + span::before { content: "·"; margin: 0 6px; }
.card .meta span:last-child { overflow: hidden; text-overflow: ellipsis; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { text-align: center; padding: 48px 16px; display: grid; gap: 10px; justify-items: center; }
.empty h2 { font-size: 22px; }

/* Ronde knop */
.fab {
  position: fixed; z-index: 6;
  right: calc(max(16px, env(safe-area-inset-right, 0px)) + 4px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 80px);
  height: 56px; padding: 0 22px 0 18px; border-radius: 999px; border: 0;
  background: var(--herb); color: var(--herb-ink); font-weight: 700; font-size: 16px;
  display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 20px rgb(0 0 0 / .18);
}
.fab svg { width: 22px; height: 22px; }

/* Knoppen en velden */
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px;
  min-height: 46px; padding: 0 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--herb); border-color: var(--herb); color: var(--herb-ink); }
.btn.danger { color: var(--danger); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .55; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 14px; font-weight: 600; }
.input, textarea.input, select.input {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px;
  padding: 11px 13px; font-size: 16px; min-height: 46px;
}
textarea.input { resize: vertical; line-height: 1.45; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; min-width: 0; }
.stack { display: grid; gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; }
.notice { border-radius: 12px; padding: 10px 14px; font-size: 14px; background: var(--sunk); }
.notice.error { color: var(--danger); }

/* Detail */
.back { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 12px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
.hero { aspect-ratio: 16 / 10; width: 100%; max-width: 100%; border-radius: var(--r); overflow: hidden; background: var(--sunk); display: grid; place-items: center; }
.hero img { width: 100%; height: 100%; object-fit: cover; }
.hero .initial { font-family: var(--font-display); font-size: 80px; font-weight: 800; color: var(--herb); opacity: .5; }
.title-block { display: grid; gap: 6px; margin-top: 16px; }
.title-block h1 { font-size: 30px; font-weight: 800; letter-spacing: -.01em; }
.title-block .sub { font-size: 17px; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 13px; font-weight: 600; background: var(--sunk); border-radius: 999px; padding: 3px 10px; }
.section { margin-top: 28px; display: grid; gap: 12px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-head h2 { font-size: 21px; }
.servings { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.servings button { width: 40px; height: 38px; border: 0; background: none; font-size: 20px; font-weight: 600; }
.servings output { min-width: 64px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.ing { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.ing li { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ing .amt { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.ing .amt.scaled { color: var(--herb); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; counter-increment: s; }
.steps li::before {
  content: counter(s); width: 30px; height: 30px; border-radius: 50%; background: var(--herb); color: var(--herb-ink);
  display: grid; place-items: center; font-weight: 700; font-size: 15px;
}
.steps b { display: block; margin-bottom: 2px; }
.steps.check li { grid-template-columns: 34px 1fr; cursor: pointer; }
.steps.check li::before { content: none; }
.step-check { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--herb); background: var(--surface); color: var(--herb); font-weight: 700; font-size: 15px; display: grid; place-items: center; padding: 0; }
.steps.check li.done { opacity: .55; }
.steps.check li.done .step-check { background: var(--herb); color: var(--herb-ink); }
.steps.check li.done div { text-decoration: line-through; text-decoration-color: var(--muted); }
.ai-note { border: 1px dashed var(--saffron); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 4px; }
.ai-note ul { margin: 0; padding-left: 18px; }
.ai-note .linkbtn { justify-self: start; }
.tip { background: var(--sunk); border-radius: var(--r); padding: 14px 16px; }
.tip b { display: block; }
.byline { font-size: 14px; color: var(--muted); display: grid; gap: 2px; margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
.actions > * { flex: 1 1 140px; }

/* Bewerken */
.ing-edit { display: grid; gap: 8px; }
.ing-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) 64px 64px 28px; gap: 6px; align-items: center; }
.ing-row .jar { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: grid; place-items: center; padding: 0; font-size: 0; }
.ing-row .jar svg { width: 18px; height: 18px; }
.ing-row .jar[aria-pressed="true"] { background: var(--saffron); border-color: var(--saffron); color: #2A1C02; }
.ing.addable li { grid-template-columns: minmax(0, 1fr) auto 32px; align-items: center; column-gap: 14px; padding: 8px 0; }
.muted-amt { color: var(--muted); font-weight: 600; }
.addbtn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--herb); background: none; color: var(--herb); font-size: 20px; line-height: 1; display: grid; place-items: center; padding: 0; justify-self: end; }
.addbtn[aria-pressed="true"] { background: var(--herb); color: var(--herb-ink); font-size: 15px; }
.ing-row .input { min-height: 42px; padding: 8px 10px; }
.ing-row button { height: 38px; border: 0; background: none; color: var(--muted); font-size: 20px; }
.step-edit { display: grid; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.step-edit .head { display: flex; gap: 6px; }
.step-edit .head .input { flex: 1; min-width: 0; }
.step-edit .head button { border: 0; background: none; color: var(--muted); font-size: 20px; width: 38px; }
.photo-pick { display: flex; gap: 12px; align-items: center; }
.photo-pick .thumb { width: 110px; flex: none; }
.warn { color: var(--danger); font-size: 14px; }

/* Bevestiging en melding */
.sheet-bg { overscroll-behavior: contain; touch-action: none; position: fixed; left: 0; right: 0; top: var(--vvtop, 0px); height: var(--vvh, 100%); background: rgb(0 0 0 / .4); z-index: 20; display: grid; align-items: end; }
.sheet {
  background: var(--surface); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden;
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  max-width: 680px; width: 100%; margin: 0 auto;
}
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 150px);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px;
  max-width: calc(100% - 32px);
}
.demo-banner { font-size: 13px; background: var(--saffron); color: #1E1503; border-radius: 10px; padding: 8px 12px; font-weight: 600; }
.auth { min-height: 80vh; display: grid; align-content: center; gap: 22px; padding-top: 24px; }
.auth h1 { font-size: 38px; font-weight: 800; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--sunk); border-radius: 12px; padding: 4px; }
.tabs button { border: 0; background: none; border-radius: 9px; min-height: 40px; font-weight: 600; }
.tabs button[aria-selected="true"] { background: var(--surface); }
.code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 26px; font-weight: 700; letter-spacing: .12em; }
.spinner { width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--herb); border-radius: 50%; animation: spin .8s linear infinite; margin: 40px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

/* Omlaag trekken om te verversen */
.ptr { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 6px); z-index: 15; width: 36px; height: 36px; margin-left: -18px;
  border-radius: 50%; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 4px 14px rgb(0 0 0 / .12);
  display: grid; place-items: center; color: var(--herb); opacity: 0; transform: translateY(-48px); pointer-events: none; }
.ptr svg { width: 18px; height: 18px; }
.ptr.ready { color: var(--herb-ink); background: var(--herb); border-color: var(--herb); }
.ptr.spin { transition: transform .2s ease-out, opacity .2s; }
.ptr.spin svg { animation: spin .8s linear infinite; }
.ptr.back { transition: transform .25s ease-out, opacity .25s; }
.updated { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
.updated svg { width: 13px; height: 13px; }
.ptr-hint { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 16; transform: translate(-50%, -70px);
  display: inline-flex; align-items: center; gap: 8px; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 8px 14px 8px 10px;
  font-size: 14px; font-weight: 600; white-space: nowrap; box-shadow: 0 6px 20px rgb(0 0 0 / .18); transition: transform .35s ease-out; pointer-events: none; }
.ptr-hint.show { transform: translate(-50%, 0); }
.ptr-hint .arr { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--herb); color: var(--herb-ink); animation: nudge 1.1s ease-in-out infinite; }
.ptr-hint .arr svg { width: 13px; height: 13px; }
@keyframes nudge { 0%, 100% { transform: translateY(-2px); } 50% { transform: translateY(3px); } }
@media (prefers-reduced-motion: reduce) { .ptr-hint .arr { animation: none; } .ptr-hint { transition: none; } }

/* Rode prullenbak in de kop */
.iconbtn.trash { color: var(--danger); }
.iconbtn.on { background: var(--herb); color: var(--herb-ink); border-color: var(--herb); }
.brand-actions { display: flex; align-items: center; gap: 10px; }
.choice-sheet .btn { justify-content: space-between; }
.choice-sheet .btn small { font-weight: 500; color: var(--muted); }
.btn.danger-fill { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger-fill small { color: rgb(255 255 255 / .8); }

/* Los gerecht op het weekmenu */
.loose { display: grid; gap: 10px; background: var(--sunk); border-radius: 12px; padding: 12px; }
.loose .row2 { display: flex; gap: 8px; }
.loose .row2 .input { flex: 1; min-width: 0; }
.check-line { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.check-line input { width: 20px; height: 20px; accent-color: var(--herb); margin: 0; }
.mini.plate { font-size: 20px; }
.meal.loose-meal .meal-open { background: none; border: 0; border-radius: 10px; padding: 0; width: 100%; color: inherit; }
.loose-text { display: grid; min-width: 0; text-align: left; }
.meal-title.loose-title { white-space: normal; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; line-height: 1.3; }
.meal-sub { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }

/* Wat kan ik maken? */
.fridge-entry { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-top: 4px; }
.fridge-entry .ico { width: 40px; height: 40px; border-radius: 12px; background: color-mix(in srgb, var(--herb) 14%, transparent); color: var(--herb); display: grid; place-items: center; flex: none; }
.fridge-entry .ico svg { width: 22px; height: 22px; }
.fridge-entry span:not(.ico):not(.chev) { display: grid; flex: 1; min-width: 0; }
.fridge-entry small { font-size: 13px; }
.fridge-entry .chev { font-size: 24px; color: var(--muted); line-height: 1; }
.chipwrap { display: flex; flex-wrap: wrap; gap: 8px; }
.chip.have { background: var(--herb); color: var(--herb-ink); border-color: var(--herb); display: inline-flex; align-items: center; gap: 6px; }
.chip.have b { font-weight: 700; opacity: .8; }
.chip.sugg { color: var(--ink); }
.match { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.match .mini { width: 56px; height: 56px; }
.match h3 { font-size: 16px; font-weight: 600; margin: 0 0 2px; }
.match .bar { height: 5px; border-radius: 3px; background: var(--sunk); overflow: hidden; margin: 6px 0 4px; }
.match .bar i { display: block; height: 100%; background: var(--herb); border-radius: 3px; }
.match small { font-size: 13px; color: var(--muted); display: block; }
.match small b { color: var(--ink); font-weight: 600; }
.match.full { border-color: var(--herb); }
.badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; background: var(--herb); color: var(--herb-ink); border-radius: 999px; padding: 2px 8px; margin-left: 6px; vertical-align: 2px; }

/* Voorraadkast beheren */
.pantry-chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 4px 4px 12px; font-size: 14px; }
.pantry-chip button { border: 0; background: none; color: var(--muted); width: 24px; height: 24px; font-size: 17px; line-height: 1; padding: 0; }
.pantry-group { display: grid; gap: 8px; }

/* Uitnodiging */
.invite-parts { display: grid; gap: 8px; }
.invite-part { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; background: var(--sunk); border-radius: 12px; padding: 10px 12px; }
.invite-part .label { grid-column: 1 / -1; }
.invite-part .val { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; user-select: all; -webkit-user-select: all; }
.invite-part .val.code { font-size: 20px; letter-spacing: .14em; }
.copy-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 12px; font-weight: 600; font-size: 14px; min-height: 36px; }
.copy-btn.done { background: var(--herb); color: var(--herb-ink); border-color: var(--herb); }
.demo-note { font-size: 13px; color: var(--muted); text-align: center; }

/* Op je beginscherm zetten */
.howto-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: st; }
.howto-steps li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: start; counter-increment: st; font-size: 15px; line-height: 1.45; }
.howto-steps li::before { content: counter(st); width: 28px; height: 28px; border-radius: 50%; background: var(--herb); color: var(--herb-ink); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.howto-steps .key { display: inline-flex; align-items: center; gap: 4px; vertical-align: -3px; background: var(--sunk); border: 1px solid var(--line); border-radius: 7px; padding: 1px 7px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.howto-steps .key svg { width: 15px; height: 15px; }
#howto-body, #hs-body { display: grid; gap: 14px; }
.howto-ok { display: flex; align-items: center; gap: 12px; background: color-mix(in srgb, var(--herb) 12%, transparent); border-radius: 12px; padding: 12px 14px; font-size: 15px; }
.howto-ok b { color: var(--herb); }

/* Beheer: overzicht en activiteit */
.adm-tabs { grid-template-columns: repeat(5, auto); }
.adm-tabs button { font-size: 13px; padding: 0 6px; white-space: nowrap; }
.metric-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.metric { text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; display: grid; gap: 2px; color: inherit; font: inherit; cursor: pointer; }
.metric b { font-family: var(--font-display); font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.metric span { font-size: 12.5px; color: var(--muted); line-height: 1.25; }
.metric[aria-pressed="true"] { border-color: var(--herb); box-shadow: inset 0 0 0 1px var(--herb); }
.colchart { display: flex; align-items: flex-end; gap: 2px; height: 110px; padding-top: 6px; border-bottom: 1px solid var(--line); }
.colchart i { flex: 1; background: var(--herb); border-radius: 3px 3px 0 0; min-width: 2px; opacity: .85; }
.colchart-axis { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); gap: 8px; }
.person-stats small { display: block; font-size: 13px; }
.pnums { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.stat small { font-size: 12.5px; color: var(--herb); font-weight: 600; }
.bars { display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) 34px; gap: 10px; align-items: center; font-size: 14px; }
.bar-row .track { height: 10px; border-radius: 5px; background: var(--sunk); overflow: hidden; }
.bar-row .track i { display: block; height: 100%; border-radius: 5px; background: var(--herb); }
.bar-row .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.top-list { margin: 0; padding: 0; list-style: none; display: grid; }
.top-list li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.top-list li:last-child { border-bottom: 0; }
.top-list .n { margin-left: auto; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.act-filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.act-filters::-webkit-scrollbar { display: none; }
.act-day { margin: 14px 0 4px; }
.act { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: start; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; margin-bottom: 8px; }
.act p { margin: 0; font-size: 15px; line-height: 1.35; }
.act small { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
.act .t { font-size: 12.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.act.other { border-left: 3px solid var(--saffron); }
.badge-act { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .03em; border-radius: 999px; padding: 1px 7px; margin-left: 4px; vertical-align: 1px; background: var(--sunk); color: var(--muted); }
.badge-act.ins { background: color-mix(in srgb, var(--herb) 16%, transparent); color: var(--herb); }
.badge-act.del { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
.badge-act.res { background: color-mix(in srgb, var(--saffron) 20%, transparent); color: #8a5a00; }
.diff { display: grid; gap: 10px; }
.diff-sec { display: grid; gap: 4px; }
.diff-sec > b { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.diff-line { font-size: 15px; line-height: 1.4; padding: 6px 10px; border-radius: 8px; background: var(--sunk); overflow-wrap: anywhere; }
.diff-line.add { background: color-mix(in srgb, var(--herb) 13%, transparent); }
.diff-line.rem { background: color-mix(in srgb, var(--danger) 11%, transparent); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--danger) 60%, transparent); }
.diff-line .old { color: var(--muted); text-decoration: line-through; }
.diff-line .arr { color: var(--muted); margin: 0 6px; }

/* Offline en live */
.net-bar { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 6px); z-index: 14; display: inline-flex; align-items: center; gap: 8px;
  background: var(--ink); color: var(--bg); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; box-shadow: 0 4px 14px rgb(0 0 0 / .15); max-width: calc(100% - 24px); }
.net-bar[hidden] { display: none; }
.net-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--saffron); flex: none; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--herb); display: inline-block; box-shadow: 0 0 0 3px color-mix(in srgb, var(--herb) 25%, transparent); }

/* Bladeren tussen recepten */
.pager { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; margin-right: 4px; }
.pg-btn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 20px; line-height: 1; padding: 0 0 2px; display: grid; place-items: center; }
.pg-btn:disabled { opacity: .35; }
@keyframes slideL { from { transform: translateX(28px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes slideR { from { transform: translateX(-28px); opacity: .4; } to { transform: none; opacity: 1; } }
#app.slide-l { animation: slideL .2s ease-out; }
#app.slide-r { animation: slideR .2s ease-out; }
@media (prefers-reduced-motion: reduce) { #app.slide-l, #app.slide-r { animation: none; } }

/* Tips */
.hdr-actions { display: flex; align-items: center; gap: 8px; }
.tab { position: relative; }
.tab .tab-dot { position: absolute; top: 2px; left: calc(50% + 8px); width: 9px; height: 9px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 0 2px var(--surface); }
.kind-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kind-pick button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 6px; font-weight: 600; font-size: 14px; display: grid; justify-items: center; gap: 2px; }
.kind-pick button span { font-size: 20px; line-height: 1; }
.kind-pick button[aria-pressed="true"] { border-color: var(--herb); box-shadow: 0 0 0 2px var(--herb); }
.tip-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; }
.tip-card.new { border-left: 3px solid var(--danger); }
.tip-card.done { opacity: .6; }
.tip-head { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.tip-head .t { margin-left: auto; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.tip-text { margin: 0; font-size: 15px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.tip-actions { display: flex; gap: 14px; }

/* Nieuwe versie */
.update-bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 78px); z-index: 25; display: flex; align-items: center; gap: 10px;
  background: var(--ink); color: var(--bg); border-radius: 999px; padding: 6px 6px 6px 16px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgb(0 0 0 / .2); width: max-content; max-width: calc(100% - 24px); }
.update-bar button { border: 0; border-radius: 999px; font-weight: 700; font-size: 14px; }
.update-bar .go { background: var(--herb); color: var(--herb-ink); padding: 8px 14px; }
.update-bar .later { background: none; color: var(--bg); opacity: .7; width: 30px; height: 30px; font-size: 18px; padding: 0; }

/* ================= Redesign: vorm en nieuwe onderdelen ================= */
h1, h2, h3 { font-weight: 600; letter-spacing: -0.015em; }
.brand h1, .title-block h1, .auth h1 { font-weight: 600; }
h1 em, h2 em { font-style: italic; font-weight: 500; }
.uline { text-decoration: underline; text-decoration-color: var(--acc); text-decoration-thickness: 5px; text-underline-offset: 5px; }
.wrap { padding-block: 8px 190px; }
:focus-visible { outline-color: var(--acc); }
.btn { border-radius: 999px; min-height: 48px; }
.btn.block { width: 100%; }
.input, textarea.input, select.input { border-radius: 14px; }
.panel, .shop-list, .day, .tip, .pantry-check, .fridge-entry, .match, .stat, .act, .tip-card { border-radius: var(--r); }
.iconbtn { width: 44px; height: 44px; }
.chip, .fbtn, .surprise, .sortbtn { min-height: 44px; }
.chip { padding: 0 16px; display: inline-flex; align-items: center; }
.chip[aria-pressed="true"] { background: var(--herb); color: var(--herb-ink); border-color: var(--herb); }
.label { letter-spacing: .08em; }
.toast { background: var(--herb); color: var(--herb-ink); top: calc(env(safe-area-inset-top, 0px) + 12px); bottom: auto; box-shadow: 0 8px 24px rgb(0 0 0 / .2); text-align: center; }
.sheet { background: var(--bg); border-radius: 28px 28px 0 0; }
.sheet-search { background: var(--surface); }
.tabs { border-radius: 999px; }
.tabs button { border-radius: 999px; }
.tabs button[aria-selected="true"] { background: var(--herb); color: var(--herb-ink); }
.update-bar { bottom: calc(env(safe-area-inset-bottom, 0px) + 100px); }
.update-bar .go { background: var(--acc); color: var(--acc-ink); }

/* Zwevende tabbalk met ronde plusknop */
.tabbar {
  left: max(16px, env(safe-area-inset-left, 0px)); right: auto; max-width: calc(100% - 100px); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: flex; gap: 2px; align-items: center; height: 64px; box-sizing: border-box; padding: 6px;
  border-radius: 999px; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 94%, transparent);
  box-shadow: 0 12px 30px rgb(31 58 46 / .18);
}
.tab { display: flex; align-items: center; justify-content: center; gap: 6px; height: 52px; min-width: 46px; padding: 0 10px; border-radius: 999px; color: var(--ink); font-size: 13.5px; font-weight: 700; }
.tab svg { width: 22px; height: 22px; flex: none; }
@media (max-width: 429px) { .tab { min-width: 40px; padding: 0 7px; } .tab.long[aria-current="page"] { padding: 0 12px 0 10px; gap: 5px; font-size: 13px; letter-spacing: -.1px; } }
.tab span:not(.tab-dot) { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tab[aria-current="page"] { background: var(--herb); color: var(--herb-ink); padding: 0 14px 0 12px; }
.tab[aria-current="page"] span:not(.tab-dot) { position: static; width: auto; height: auto; overflow: visible; clip: auto; }
.tab .tab-dot { top: 8px; left: auto; right: 6px; }
.fab {
  right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  width: 56px; height: 56px; padding: 0; border-radius: 50%; justify-content: center;
  background: var(--acc); color: var(--acc-ink); box-shadow: 0 12px 30px rgb(255 122 26 / .35); z-index: 7;
}
.fab svg { width: 26px; height: 26px; }

/* Recepten: kop, zoekbalk met menuknop, vanavond, tegels */
.hello h1 { font-size: 34px; line-height: 1.04; letter-spacing: -0.02em; }
.greet { font-size: 14px; font-weight: 500; }
.me-btn { border: 2px solid var(--ink); background: var(--surface); border-radius: 50%; width: 46px; height: 46px; padding: 0; display: grid; place-items: center; flex: none; overflow: hidden; }
.me-btn .avatar { box-shadow: none; }
.search { height: 52px; padding: 0 4px 0 16px; }
.menu-btn { position: relative; flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--herb); color: var(--herb-ink); display: grid; place-items: center; padding: 0; }
.menu-btn svg { width: 19px; height: 19px; }
.menu-btn.on::after { content: ""; position: absolute; right: 0; top: 0; width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; background: var(--acc); border: 2px solid var(--surface); }
.search .clear { margin-right: 0; }
.tonight { display: flex; gap: 14px; min-height: 176px; box-sizing: border-box; padding: 18px; border-radius: 28px; background: var(--herb); color: var(--herb-ink); }
.tonight .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.tonight .tag-now { background: var(--acc); color: var(--acc-ink); font-size: 11px; font-weight: 700; letter-spacing: .08em; padding: 4px 10px; border-radius: 999px; }
.tonight h2 { font-size: 25px; line-height: 1.08; letter-spacing: -0.01em; }
.tonight p { margin: 0; font-size: 13px; color: var(--strong-muted); }
.tonight .acts { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.tonight .go { height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: var(--bg); color: var(--ink); font-weight: 700; font-size: 14px; }
.tonight .ghost { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px; border: 1px solid var(--strong-muted); border-radius: 999px; background: transparent; color: var(--herb-ink); font-weight: 700; font-size: 14px; }
.tonight .arch { flex: none; width: 112px; border-radius: 999px 999px 18px 18px; overflow: hidden; background: #E9DBBE; display: grid; place-items: center; }
.tonight .arch img { width: 100%; height: 100%; object-fit: cover; }
.tonight .arch b { font-family: var(--font-display); font-size: 54px; color: #A8997A; font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 12px; height: 98px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; color: var(--ink); text-align: left; }
.tile small { font-size: 12px; font-weight: 600; color: var(--muted); }
.tile .big { font-family: var(--font-display); font-weight: 600; font-size: 24px; line-height: 1; }
.tile .dots { display: flex; gap: 5px; }
.tile .dots i { width: 9px; height: 9px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #8A927F; }
.tile .dots i.on { background: var(--ink); border-color: var(--ink); }
.tile .dots i.today { border-color: var(--acc); }
.tile .dots i.today.on { background: var(--acc); }
.tile .ring { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; line-height: 1.2; }
.tile .ico { width: 34px; height: 34px; border-radius: 50%; background: var(--herb); color: var(--herb-ink); display: grid; place-items: center; }
.tile .ico svg { width: 18px; height: 18px; }
.tile b { font-size: 13px; font-weight: 600; line-height: 1.2; }
.chiprow { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gut)); padding: 0 max(16px, env(safe-area-inset-left, 0px)); }
.chiprow::-webkit-scrollbar { display: none; }
.chiprow .chip { flex: none; border-color: var(--line2); background: transparent; height: 44px; }
.chiprow .chip[aria-pressed="true"] { background: var(--herb); border-color: var(--herb); }
.fnote { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
.rlist { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.rrow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 8px 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); text-align: left; }
.rrow .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.rrow b { font-weight: 600; font-size: 16px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rrow small { font-size: 13px; color: var(--muted); }
.fav-pip { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--acc); color: var(--acc-ink); display: grid; place-items: center; }
.fav-pip svg { width: 13px; height: 13px; }
.fav-dot { background: var(--acc); color: var(--acc-ink); width: 28px; height: 28px; }
.thumb { border-radius: 22px; }
.thumb .initial { font-family: var(--font-display); font-weight: 600; color: var(--letter); opacity: 1; font-size: 60px; }
.card .meta span:first-child::before { content: none; }
.grid { gap: 16px 12px; }

/* Menu onder de filterknop */
.pop-bg { position: fixed; inset: 0; z-index: 20; background: rgb(20 37 29 / .45); }
.pop { position: fixed; z-index: 21; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); max-width: 656px; margin: 0 auto; box-sizing: border-box; padding: 18px; border-radius: 28px; background: var(--bg); box-shadow: 0 20px 50px rgb(0 0 0 / .3); display: flex; flex-direction: column; gap: 14px; max-height: calc(var(--vvh, 100dvh) - 120px); overflow-y: auto; overscroll-behavior: contain; animation: rise .18s ease-out; }
.pop .lab { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: var(--sunk); }
.seg button { display: flex; align-items: center; justify-content: center; gap: 6px; height: 40px; border: 0; border-radius: 999px; background: transparent; color: var(--ink); font-weight: 600; font-size: 14px; }
.seg button svg { width: 17px; height: 17px; }
.seg button[aria-pressed="true"] { background: var(--herb); color: var(--herb-ink); font-weight: 700; }
.sortgrid { display: flex; flex-wrap: wrap; gap: 6px; }
.sortgrid button { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 4px 12px 4px 8px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--ink); font-size: 13.5px; font-weight: 500; text-align: left; line-height: 1.2; }
.sortgrid button i { flex: none; width: 18px; height: 18px; border-radius: 50%; box-sizing: border-box; border: 2px solid var(--line2); }
.sortgrid button[aria-checked="true"] { border-color: var(--herb); background: var(--surface); font-weight: 700; }
.sortgrid button[aria-checked="true"] i { border: 5px solid var(--herb); }
.frows { padding: 0 14px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
.frows button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 0; border: 0; border-bottom: 1px solid var(--sunk); background: transparent; color: var(--ink); text-align: left; }
.frows button:last-child { border-bottom: 0; }
.frows b { flex: 1; font-weight: 600; }
.frows span { font-size: 14px; color: var(--muted); max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frows span.on { color: var(--acc); font-weight: 700; }
.frows svg { width: 15px; height: 15px; flex: none; }
.pop.pop-bottom { top: auto; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); max-height: calc(var(--vvh, 100dvh) - 36px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); animation: rise .22s ease-out; }
.pop-foot { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; position: sticky; bottom: -18px; margin: 0 -18px -18px; padding: 10px 18px 18px; background: var(--bg); }
.pm-head { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 8px; position: sticky; top: -18px; margin: -18px -18px 0; padding: 14px 18px 8px; background: var(--bg); z-index: 1; }
.pm-head h2 { margin: 0; font-size: 22px; }
.pm-head .linkbtn { font-size: 14px; }
.pm-back { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line2); background: var(--surface); color: var(--ink); display: grid; place-items: center; padding: 0; }
.pm-back svg { width: 18px; height: 18px; }
.pm-body { display: flex; flex-direction: column; gap: 10px; }
.pm-body .opts { padding: 0 14px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
.pm-body .opt:last-child { border-bottom: 0; }
.pm-hint { margin: 0; font-size: 14px; }
.pop-foot button { height: 50px; border-radius: 999px; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
.pop-foot .ghost { border: 1px solid var(--line2); background: transparent; color: var(--ink); }
.pop-foot .solid { border: 0; background: var(--herb); color: var(--herb-ink); }
.die-ico { font-size: 18px; line-height: 1; }

/* Recept */
.d-hero { background: var(--hero); margin: 0 calc(-1 * var(--gut)); padding: calc(env(safe-area-inset-top, 0px) + 12px) var(--gut) 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; min-height: 270px; box-sizing: border-box; }
.d-hero .hbtn { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--hero-btn); color: var(--hero-btn-ink); display: grid; place-items: center; padding: 0; }
.d-hero .hbtn svg { width: 22px; height: 22px; }
.d-hero .hbtn.fav[aria-pressed="true"] { background: var(--acc); color: var(--acc-ink); }
.d-hero .hbtn.fav svg { width: 20px; height: 20px; }
.d-arch { width: min(220px, 52vw); aspect-ratio: 4 / 5; margin-top: 12px; border-radius: 999px 999px 0 0; overflow: hidden; background: #2A4A3B; display: grid; place-items: center; }
.d-arch img { width: 100%; height: 100%; object-fit: cover; }
.d-arch b { font-family: var(--font-display); font-weight: 600; font-size: 96px; color: #C9D3C4; }
.d-mid { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.d-mid .pager { margin: 0; color: var(--hero-btn); opacity: .85; }
.d-mid .pg-btn { background: transparent; border-color: color-mix(in srgb, var(--hero-btn) 40%, transparent); color: var(--hero-btn); }
.d-sheet { position: relative; margin: -28px calc(-1 * var(--gut)) 0; padding: 22px calc(var(--gut) + 4px) 0; border-radius: 32px 32px 0 0; background: var(--bg); display: flex; flex-direction: column; gap: 14px; }
.d-sheet .tags .tag:first-child { background: var(--herb); color: var(--herb-ink); }
.d-sheet .tag { background: transparent; border: 1px solid var(--ink); }
.d-sheet h1 { font-size: 32px; line-height: 1.06; letter-spacing: -0.02em; }
.d-sheet .sub { margin: 0; font-size: 15px; color: var(--muted); }
.d-stats { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 10px; }
.d-stat { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.d-stat > span:first-child { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.d-stat small { font-size: 12px; font-weight: 600; color: var(--muted); }
.d-stat b { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.1; white-space: nowrap; }
.d-stat .pm { flex: none; display: flex; flex-direction: row; align-items: center; gap: 6px; }
.d-stat .pm button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line2); background: transparent; color: var(--ink); font-size: 22px; line-height: 1; padding: 0; }
.d-stat .pm button.plus { border: 0; background: var(--herb); color: var(--herb-ink); }
.d-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: var(--sunk); }
.d-tabs button { position: relative; height: 44px; border: 0; border-radius: 999px; background: transparent; color: var(--ink); font-size: 14px; font-weight: 600; }
.d-tabs button[aria-selected="true"] { background: var(--herb); color: var(--herb-ink); font-weight: 700; }
.d-tabs .pip { position: absolute; top: 9px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--acc); }
.d-sheet .ing { border-top: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 0 6px 0 16px; }
.d-sheet .ing li:last-child { border-bottom: 0; }
.d-sheet .ing li { border-bottom-color: var(--sunk); }
.d-sheet .ing .amt.scaled { color: var(--acc); }
.d-sheet .addbtn { width: 30px; height: 30px; border: 1.5px solid var(--ink); color: var(--ink); position: relative; }
.d-sheet .addbtn::after { content: ""; position: absolute; inset: -7px; }
.d-sheet .addbtn[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
.sprog { display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 13px; font-weight: 700; }
.sprog .track { flex: 1; height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.sprog .track i { display: block; height: 100%; border-radius: 4px; background: var(--acc); transition: width .3s ease; }
.srows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.srow { display: flex; align-items: flex-start; gap: 12px; width: 100%; min-height: 52px; box-sizing: border-box; padding: 11px 16px 11px 12px; border-radius: 18px; border: 1px solid var(--line); background: transparent; color: var(--ink); text-align: left; }
.srow .n { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--ink); box-sizing: border-box; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.srow .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding-top: 4px; }
.srow .tx b { font-weight: 600; }
.srow .tx span { font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.srow.done { color: var(--muted); }
.srow.done .n { border: 0; background: var(--herb); color: var(--herb-ink); }
.srow.done .n svg { width: 15px; height: 15px; }
.srow.done .tx b { text-decoration: line-through; }
.srow.done .tx span { display: none; }

  out = out.trim();
  return out.charAt(0).toUpperCase() + out.slice(1);
}
// Lange alinea opdelen in losse stappen (per zin; korte zinnen blijven bij de vorige)
function splitSentences(p) {
  const parts = String(p).split(/(?<=[.!?])\s+(?=[A-ZÀ-Ý0-9])/).map((x) => x.trim()).filter(Boolean);
  const out = [];
  for (const x of parts) { if (out.length && (x.length < 45 || out[out.length - 1].length < 45)) out[out.length - 1] += " " + x; else out.push(x); }
  return out;
}
const QTY_TOKEN = /(?:^|\s)(\d+(?:[.,]\d+)?(?:\s*[-–]\s*\d+)?|\d+\s*\/\s*\d+|[½⅓⅔¼¾⅛])\s*(?:g|gr|gram|kg|ml|l|dl|cl|el|tl|tbsp|tsp|cups?|stuks?|tenen|teen)?\s+(?=\p{L})/giu;
// Instagram-oproepjes en reclameregels
const CTA_RE = /(vergeet .{0,12}niet op te slaan|sla (dit|hem|'m|’m|het)( recept)? op|^sla op|bewaar (dit|deze)|save (this|for later|&|en)|^save\b|volg (mij|me|ons)( voor|\b)|follow (me|for)|tag (een|iemand|a friend|someone)|deel (dit|met)|share (this|with)|link in (de )?bio|meer recepten|^enjoy\b|^eet smakelijk|^smakelijk)/i;
const PROMO_RE = /@\S+.*(gekregen|code|samenwerking|sponsor|partner|i\.s\.m|ad\b|korting)|(gekregen|code|samenwerking|sponsor|korting).*@\S+/i;
function parseRecipeText(src) {
  const out = { title: "", subtitle: "", servings: 2, prep_time_minutes: null, ingredients: [], steps: [], tips: [], tags: [], source_url: "" };
  const warnings = [];
  const UNIT_WORD = /^(g|gr|gram|kg|ml|l|dl|cl|el|tl|eetlepels?|theelepels?|stuks?|tenen|teentjes?|teen|blikjes?|blik|zakjes?|snufje|snuf|bosjes?|bos|takjes?|cups?|tbsp|tsp|tablespoons?|teaspoons?|handje|handjes|scheutje|plakjes?|sneetjes?|cloves?)\.?$/i;
  // 1. Regels voorbereiden: opsommingsteken onthouden, emoji en tekens vooraan weg, hashtags achteraan weg
  const prepared = [];
  for (const raw of String(src).replace(/\r/g, "").split("\n")) {
    let line = raw.replace(/ /g, " ").trim().replace(/^(\d{1,2})️?⃣\s*/u, "$1. ");
    if (/^([#@][\p{L}\p{N}_.]+[\s\p{Extended_Pictographic}\uFE0F]*)+$/u.test(line)) continue; // alleen hashtags of @namen
    const bullet = /^[^\p{L}\p{N}(“"'¼½¾⅓⅔⅛]/u.test(line);
    line = line.replace(/^[^\p{L}\p{N}(“"'¼½¾⅓⅔⅛]+/u, "").trim();
    line = line.replace(/(\s+#[\p{L}\p{N}_]+)+\s*$/u, "").replace(/[\s\p{Extended_Pictographic}️‍]+$/u, "").trim();
    if (!line) continue;
    if (/^([#@][\p{L}\p{N}_.]+\s*)+$/u.test(line)) continue;
    if (/^(stap|step)\s*\d+\s*[:.)-]?\s*$/i.test(line)) continue;
    if (line.length < 140 && (CTA_RE.test(line) || PROMO_RE.test(line))) continue;
    line = line.replace(/(^|\s)(\d+(?:[.,]\d+)?)(g|gr|kg|ml|cl|dl|l|el|tl)\b/gi, (m0, sp, n, u) => `${sp}${n} ${u.toLowerCase()}`); // "200G" -> "200 g"
    // Ingrediënten die allemaal op één regel staan ("4 salmon fillets 200 g feta 1 cup …") opknippen
    const tokens = [...line.matchAll(QTY_TOKEN)];
    if (tokens.length >= 3 && !/[.!?]\s/.test(line) && line.length > 40) {
      const cuts = tokens.map((t) => t.index + (t[0].startsWith(" ") ? 1 : 0)).filter((x) => x > 0);
      let last = 0;
      for (const c of cuts) { prepared.push({ text: line.slice(last, c).trim().replace(/,$/, ""), bullet: true, split: true }); last = c; }
      prepared.push({ text: line.slice(last).trim(), bullet: true, split: true });
      continue;
    }
    prepared.push({ text: line, bullet });
  }
  // 2. Indelen in titel, ingrediënten, stappen en tips
  let section = "head";
  const isQtyStart = (l) => /^(\d+(?:[.,]\d+)?|\d+\s*\/\s*\d+|[½⅓⅔¼¾⅛])\s*\S/.test(l);
  const isNumbered = (l) => /^\d+[.)]\s+\S/.test(l);
  const pushSteps = (l, bullet) => {
    const clean = l.replace(/^(stap\s*)?\d+[.):]\s+/i, "");
    if (clean.length > 220 && !isNumbered(l) && !bullet) for (const x of splitSentences(clean)) out.steps.push({ title: "", text: x });
    else out.steps.push(splitTitled(clean));
  };
  for (let n = 0; n < prepared.length; n++) {
    const { text: line, bullet } = prepared[n];
    const next = prepared[n + 1];
    const perPerson = /per persoon|per person/i.test(line) && !isQtyStart(line) && line.length < 60;
    if (perPerson && section === "head") out.servings = 1;
    const serv = line.match(/(?:voor|serves|recept voor)\s*(\d{1,2})\s*(?:personen|pers\.?|p\b|people|porties)/i);
    if (serv && line.length < 50) { out.servings = +serv[1]; if (section !== "head" || out.title) { if (section === "head" && next && (next.bullet || isQtyStart(next.text))) section = "ing"; continue; } }
    const url = line.match(/https?:\/\/\S+/);
    if (url) { out.source_url = url[0]; continue; }
    if (/-url$/i.test(line) || /^(bron|link|url)\s*:?$/i.test(line)) continue;
    const sec = SECTIONS.find((x) => x.re.test(line) && line.length < 50);
    if (sec) {
      section = sec.key;
      const sp = line.match(/(\d+)\s*(?:p\b|pers|personen)/i); if (sp && sec.key === "ing") out.servings = +sp[1];
      else if (perPerson && sec.key === "ing") out.servings = 1;
      continue;
    }
    const time = line.match(/(\d+)\s*(?:min|minuten)\b/i);
    if (section === "head") {
      // Geen kopjes? Herken ingrediënten (begint met hoeveelheid of opsommingsteken) en genummerde stappen
      if (out.title && isNumbered(line)) { section = "steps"; pushSteps(line, bullet); continue; }
      if (out.title && ((isQtyStart(line) && line.length < 60) || (bullet && line.length < 60 && next && next.bullet))) section = "ing";
    }
    if (section === "head") {
      if (!out.title) out.title = line;
      else if (!out.subtitle && line.length < 160) out.subtitle = line;
      if (time && !out.prep_time_minutes) out.prep_time_minutes = +time[1];
      continue;
    }
    if (section === "ing") {
      if (isNumbered(line) && line.length > 25) { section = "steps"; pushSteps(line, bullet); continue; }
      // Lange zin zonder hoeveelheid vooraan: dan begint de bereiding (ook zonder kopje)
      if (!isQtyStart(line) && line.length > 70 && !prepared[n].split) { section = "steps"; pushSteps(line, bullet); continue; }
      // Tussenkopje in de ingrediëntenlijst ("Voor de dressing", "Salade")
      if (!isQtyStart(line) && line.length < 35 && (/:$/.test(line) || /^voor (de|het)\s/i.test(line) || (!bullet && next && next.bullet))) continue;
      const pm = line.match(/\((\d+)\s*p(?:ers(?:onen)?)?\)/i);
      if (/hoeveelheid/i.test(line)) { if (pm) out.servings = +pm[1]; continue; }
      let name, qty;
      const parts = line.split(/\t+|\s{2,}/).map((x) => x.trim()).filter(Boolean);
      // Hoeveelheid vooraan: "500 g gnocchi", "2 tenen knoflook", "1 ui"
      const lead = line.match(/^(\d+\s+\d+\s*\/\s*\d+|\d+\s*\/\s*\d+|\d+(?:[.,]\d+)?(?:\s*[-–]\s*\d+)?\s*[½⅓⅔¼¾⅛]?|[½⅓⅔¼¾⅛])\s+(\S+)\s*(.*)$/);
      if (lead && parts.length < 2) {
        if (lead[3] && UNIT_WORD.test(lead[2])) { qty = lead[1] + " " + lead[2].toLowerCase(); name = lead[3]; }
        else { qty = lead[1]; name = (lead[2] + " " + lead[3]).trim(); }
        name = name.charAt(0).toUpperCase() + name.slice(1);
      }
      else if (parts.length >= 2) { qty = parts.pop(); name = parts.join(" "); }
      else {
        const m = line.match(/^(.*?)\s+(\d+(?:[.,]\d+)?\s*[½⅓⅔¼¾⅛]?\s*\S*|[½⅓⅔¼¾⅛]\s*\S*)$/);
        if (m && !/\b(van|of|met|en)$/i.test(m[1])) { name = m[1]; qty = m[2]; } else { name = line; qty = ""; }
      }
      const a = parseAmount(qty);
      const nm = name.replace(/^[*•\-–]\s*/, "").replace(/,\s*$/, "");
      out.ingredients.push({ name: nm.charAt(0).toUpperCase() + nm.slice(1), amount: a.amount, unit: a.unit, original_text: a.original, is_pantry: isPantry(nm) });
      continue;
    }
    if (section === "steps") { pushSteps(line, bullet); continue; }
    if (section === "tips") { out.tips.push(splitTitled(line)); continue; }
  }
  // Titel netjes: geen emoji/uitroeptekens aan het eind, en HOOFDLETTERS -> gewone zin
  // Engels recept: ingrediënten en eenheden vertalen, en opnieuw bepalen wat uit de voorraadkast komt
  if (looksEnglish(String(src))) {
    let n = 0;
    out.ingredients = out.ingredients.map((i) => {
      const name = translateIngredient(i.name), unit = i.unit && EN_UNITS[i.unit.toLowerCase()] ? EN_UNITS[i.unit.toLowerCase()] : i.unit;
      if (name !== i.name || unit !== i.unit) n++;
      return { ...i, name, unit, is_pantry: isPantry(name) };
    });
    if (n) warnings.push(`${n} Engelse ingrediënten vertaald. Controleer ze even.`);
  }
  out.title = out.title.replace(/[\s\p{Extended_Pictographic}️‍!]+$/u, "").trim();
  const letters = out.title.replace(/[^\p{L}]/gu, "");
  if (letters.length > 6 && letters === letters.toUpperCase()) out.title = out.title.charAt(0) + out.title.slice(1).toLowerCase();
  out.tags = suggestTags(out);
  if (!out.title) warnings.push("Geen titel gevonden: zet de naam van het gerecht op de eerste regel.");
  if (!out.ingredients.length) warnings.push("Geen ingrediënten gevonden: zet ze onder een kopje “Ingrediënten”.");
  if (!out.steps.length) warnings.push("Geen bereiding gevonden: zet de stappen onder een kopje “Bereidingswijze”.");
  const typos = [];
  for (const i of out.ingredients) if (/vierde olijfolie/i.test(i.name)) typos.push(`“${i.name}” bedoel je “extra vierge olijfolie”?`);
  out.warnings = warnings.concat(typos);
  return out;
}

/* ================= Foto verkleinen ================= */
function dataUrlToBlob(dataUrl) {
  const [head, b64] = dataUrl.split(",");
  const type = (head.match(/^data:([^;]+)/) || [])[1] || "image/jpeg";
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type });
}
async function shrinkPhoto(file) {
  const bmp = await createImageBitmap(file).catch(async () => {
    const url = URL.createObjectURL(file);
    const img = new Image(); img.src = url; await img.decode(); return img;
  });
  const max = 1600;
  const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  for (const q of [0.82, 0.72, 0.62, 0.5, 0.4]) {
    const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", q));
    if (blob && blob.size <= 480 * 1024) return blob;
  }
  throw new Error("Deze foto is te groot, ook na verkleinen. Kies een andere foto.");
}

function enqueue(op) {
  const q = getQueue();

    const add = q.find((x) => x.t === "add" && x.tmp === op.id);
    if (add) { add.item.is_checked = op.v; setQueue(q); return; }
    const prev = q.find((x) => x.t === "check" && x.id === op.id);
    if (prev) { prev.v = op.v; setQueue(q); return; }
  }
  q.push(op); setQueue(q);
}

  try {
    while (q.length) {
      const op = q[0];
      if (op.t === "check") await store.updateShopping(op.id, { is_checked: op.v });
      if (op.t === "add") {
        const [row] = await store.addShopping(S.household.id, [op.item]);
        const local = S.shop.find((x) => x.id === op.tmp); if (local) Object.assign(local, row);
      }
      q.shift(); setQueue(q); done++;

function norm(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }

const TIME_BLOCKS = [

  ["20-30", "20–30 minuten", "", 20, 30],

const TIME_SHORT = { snel: "Snel", "20-30": "20–30 min", "30-45": "30–45 min", "45-60": "45–60 min", lang: "> 1 uur" };
function inTimeBlock(t, code) { const b = TIME_BLOCKS.find((x) => x[0] === code); return b && t > b[3] && t <= b[4]; }
// Bron van een recept, afgeleid uit de link (geen link = eigen recept)
const SOURCE_NAMES = { "hellofresh": "HelloFresh", "instagram": "Instagram", "facebook": "Facebook", "fb": "Facebook", "ah": "Allerhande",
  "jumbo": "Jumbo", "lekkerensimpel": "Lekker en Simpel", "uitpaulineskeuken": "Uit Paulines Keuken", "leukerecepten": "Leuke Recepten",
  "24kitchen": "24Kitchen", "smulweb": "Smulweb", "youtube": "YouTube", "youtu": "YouTube", "tiktok": "TikTok", "pinterest": "Pinterest" };
const OWN_SOURCE = "Eigen recept";
function sourceOf(r) {
  if (!r.source_url) return OWN_SOURCE;
  let host = "";
  try { host = new URL(r.source_url).hostname.toLowerCase().replace(/^(www|m|nl)\./, ""); } catch (_) { return "Overig"; }
  const parts = host.split(".");
  const key = parts.length > 1 ? parts[parts.length - 2] : parts[0];
  if (SOURCE_NAMES[key]) return SOURCE_NAMES[key];
  if (host.includes("allerhande")) return "Allerhande";
  return key ? key[0].toUpperCase() + key.slice(1) : "Overig";
}
function sourceList() {
  const n = {};
  S.recipes.forEach((r) => { const k = sourceOf(r); n[k] = (n[k] || 0) + 1; });
  return Object.entries(n).sort((a, b) => (a[0] === OWN_SOURCE) - (b[0] === OWN_SOURCE) || b[1] - a[1] || a[0].localeCompare(b[0], "nl"));
}
function matches(r, f) {
  if (f.src && f.src.length && !f.src.includes(sourceOf(r))) return false;
  if (f.favOnly && !S.favs.has(r.id)) return false;
  if (f.owner === "me" && ownerOf(r) !== S.user.id) return false;
  if (f.owner === "others" && ownerOf(r) === S.user.id) return false;
  if (!["all", "me", "others"].includes(f.owner) && ownerOf(r) !== f.owner) return false;
  if (f.tags.length && !f.tags[f.tagMode === "any" ? "some" : "every"]((t) => (r.tags || []).includes(t))) return false;
  if (f.time.length) {
    const t = r.prep_time_minutes;
    if (!t) return false;
    if (!f.time.some((code) => inTimeBlock(t, code))) return false;
  }
  const terms = norm(f.query).split(/\s+/).filter(Boolean);
  if (!terms.length) return true;
  const hay = norm([r.title, r.subtitle, (r.tags || []).join(" "), r.recipe_ingredients.map((i) => i.name).join(" ")].join(" "));

/* ================= 2. Wat kan ik maken? (op basis van wat je in huis hebt) ================= */
function stemTerm(t) {
  let x = norm(t).trim().replace(/\s+/g, " ");
  if (x.length > 5 && x.endsWith("en")) x = x.slice(0, -2);
  else if (x.length > 4 && /[^aeiouys]s$/.test(x)) x = x.slice(0, -1);
  return x.replace(/([aeou])\1([^aeiou])$/, "$1$2");
}
function termMatches(term, ingName) {
  const h = norm(ingName);
  return [...new Set([norm(term).trim(), stemTerm(term)])].filter(Boolean).some((v) =>
    v.length >= 4 ? h.includes(v) : new RegExp("(^|[^a-z])" + v.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).test(h));
}
function fridgeMatches() {
  const terms = S.fridge || [];
  if (!terms.length) return [];
  return S.recipes.map((r) => {
    const main = r.recipe_ingredients.filter((i) => !i.is_pantry);
    const have = main.filter((i) => terms.some((t) => termMatches(t, i.name)));
    const missing = main.filter((i) => !have.includes(i));
    return { r, main, have, missing };
  }).filter((m) => m.have.length).sort((a, b) => a.missing.length - b.missing.length || b.have.length - a.have.length || a.r.title.localeCompare(b.r.title, "nl"));
}
function fridgeSuggestions() {
  const count = new Map();
  for (const r of S.recipes) for (const i of r.recipe_ingredients) {
    if (i.is_pantry) continue;
    const n = String(i.name || "").replace(/\(.*?\)/g, "").trim().toLowerCase();
    if (n) count.set(n, (count.get(n) || 0) + 1);
  }
  const chosen = (S.fridge || []).map(norm);
  return [...count.entries()].filter(([n]) => !chosen.includes(norm(n))).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "nl")).slice(0, 16).map(([n]) => n);
}
