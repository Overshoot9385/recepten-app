/* ================= Bladeren tussen recepten (vegen naar links/rechts) ================= */
function detailPos(id) {
  const l = (S.detailList || []).filter((x) => getRecipe(x));
  const i = l.indexOf(id);
  return l.length > 1 && i >= 0 ? { i, n: l.length, list: l } : null;
}
function stepRecipe(dir) {
  const p = detailPos(S.current); if (!p) return false;
  const j = p.i + dir;
  if (j < 0 || j >= p.n) { toast(dir > 0 ? "Dit is het laatste recept in deze lijst" : "Dit is het eerste recept in deze lijst"); return false; }
  S.slideDir = dir; S.scale = null; S.current = p.list[j];
  renderDetail(); window.scrollTo(0, 0);
  return true;
}
function bindRecipeSwipe(id) {
  const app = $("#app");
  if (S.slideDir) {
    app.classList.remove("slide-l", "slide-r"); void app.offsetWidth;
    app.classList.add(S.slideDir > 0 ? "slide-l" : "slide-r"); S.slideDir = 0;
  }
  const pv = $("#pg-prev"), nx = $("#pg-next");
  if (pv) pv.onclick = () => stepRecipe(-1);
  if (nx) nx.onclick = () => stepRecipe(1);
  if (!detailPos(id)) return;
  // Eenmalige uitleg
  try { if (!localStorage.getItem("receptenboek-bladeren")) { localStorage.setItem("receptenboek-bladeren", "1"); setTimeout(() => toast("Tip: veeg naar links of rechts voor het volgende of vorige recept"), 600); } } catch (_) { /* niet erg */ }
  if (app.dataset.swipe) return; // luisteraars maar één keer koppelen
  app.dataset.swipe = "1";
  let x0 = null, y0 = 0, dx = 0, horiz = null;
  app.addEventListener("touchstart", (e) => {
    if (S.view !== "detail" || !detailPos(S.current) || e.touches.length !== 1 || document.querySelector(".sheet-bg")) { x0 = null; return; }
    const t = e.touches[0];
    if (t.clientX < 24 || t.clientX > window.innerWidth - 24 || e.target.closest("input, textarea, select")) { x0 = null; return; } // randen: laat iOS-gebaren met rust
    x0 = t.clientX; y0 = t.clientY; dx = 0; horiz = null;
  }, { passive: true });
  app.addEventListener("touchmove", (e) => {
    if (x0 == null) return;
    const t = e.touches[0]; dx = t.clientX - x0; const dy = t.clientY - y0;
    if (horiz == null && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) horiz = Math.abs(dx) > Math.abs(dy) * 1.4;
    if (!horiz) return;
    if (e.cancelable) e.preventDefault();
    app.style.transition = "none"; app.style.transform = `translateX(${dx * 0.45}px)`; app.style.opacity = String(1 - Math.min(0.35, Math.abs(dx) / 900));
  }, { passive: false });
  const end = () => {
    if (x0 == null) return;
    const go1 = horiz && Math.abs(dx) > 70 ? (dx < 0 ? 1 : -1) : 0;
    x0 = null;
    app.style.transition = "transform .18s ease-out, opacity .18s"; app.style.transform = ""; app.style.opacity = "";
    setTimeout(() => { app.style.transition = ""; }, 200);
    if (go1) stepRecipe(go1);
  };
  app.addEventListener("touchend", end); app.addEventListener("touchcancel", end);
  document.addEventListener("keydown", (e) => {
    if (S.view !== "detail" || e.target.closest("input, textarea, select") || document.querySelector(".sheet-bg")) return;
    if (e.key === "ArrowRight") stepRecipe(1); else if (e.key === "ArrowLeft") stepRecipe(-1);
  });
}

function sheet(html, onClose) {

  enableSwipe(bg, close);
  const onKey = (e) => { if (e.key === "Escape") close(); };
  bg.addEventListener("click", (e) => { if (e.target === bg) close(); });
  document.addEventListener("keydown", onKey);
  document.body.appendChild(bg);
  return { el: bg, close };
}

// Je kunt een week terugkijken; oudere weken worden elke nacht opgeruimd
function planToday() { return startDay(new Date()); }
function planRange() { const ws = startOfWeek(new Date()); return { from: addDays(ws, -7), to: addDays(ws, 13) }; }
function minWeek() { return planRange().from; }
// Boodschappen doen jullie op zondag voor de week erna: op zondag geldt de lijst voor volgende week, anders voor de rest van deze week
function shopRange() {
  const t = planToday(), ws = startOfWeek(t);
  return t.getDay() === 0 ? { from: addDays(ws, 7), to: addDays(ws, 13) } : { from: t, to: addDays(ws, 6) };
}
async function loadWeek() {
  const { from: f, to: t } = planRange(), from = isoDate(f), to = isoDate(t);
  try { S.meals = await store.mealPlan(from, to); S.mealsLoaded = true; saveCache(); }
  catch (e) {
    if (!isNetErr(e)) throw e;
    goOffline();
    const c = S.cachedMeals || (loadCache() || {});
    S.meals = c.meals || [];
  }
}
async function renderMenu() {
  S.menuWeek = 0; S.menuSel = null;
  $("#app").innerHTML = `<header class="top"><div class="brand"><h1>Planning</h1></div></header><div class="spinner" aria-label="Laden"></div>${tabBarHTML("menu")}`;
  bindTabBar();
  try { await loadWeek(); } catch (e) { toast(e.message); }
  drawMenu();
}
function drawMenu() {
  const today = isoDate(new Date());
  S.menuWeek = Math.max(-1, Math.min(1, S.menuWeek || 0));
  const ws = addDays(startOfWeek(new Date()), S.menuWeek * 7), we = addDays(ws, 6);
  const mkDays = (start) => Array.from({ length: 7 }, (_, i) => { const d = addDays(start, i); return { d, iso: isoDate(d), name: DAY_NAMES[i], ab: DAY_NAMES[i].slice(0, 2).toLowerCase() }; });
  const days = mkDays(ws);
  if (!S.menuSel || !days.some((x) => x.iso === S.menuSel)) S.menuSel = S.menuWeek === 0 ? today : days[0].iso;
  const sel = days.find((x) => x.iso === S.menuSel);
  const mealsOf = (iso) => S.meals.filter((m) => m.plan_date === iso);
  const titleOf = (m) => { if (!m.recipe_id && m.title) return m.title; const r = getRecipe(m.recipe_id); return r ? r.title : "Verwijderd recept"; };
  const selMeals = mealsOf(sel.iso);
  const longDate = sel.d.toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "long" });
  const label = S.menuWeek === 0 ? "deze week" : S.menuWeek < 0 ? "vorige week" : "volgende week";
  const future = S.meals.filter((m) => m.plan_date >= today);
  const mealHTML = (m) => {
    const r = m.recipe_id ? getRecipe(m.recipe_id) : null;
    const loose = !m.recipe_id && m.title;
    const by = planPartners().length && m.user_id && m.user_id !== S.user.id ? `<span title="Gepland door ${esc(nameOf(m.user_id))}" style="display:inline-grid">${avatarHTML(m.user_id, 22)}</span>` : "";
    return `<div class="dmeal" data-meal="${m.id}">
      <span class="ti">${esc(titleOf(m))}</span>
      <div class="row"><span class="meta-l">${by}<span>${loose ? "zonder recept" : r && r.prep_time_minutes ? timeText(r) : ""}</span></span>
        ${loose ? "" : `<span class="stepper" aria-label="Personen"><button data-dec="${m.id}" aria-label="Minder personen">−</button><output>${m.servings} pers.</output><button data-inc="${m.id}" aria-label="Meer personen">+</button></span>`}</div>
      <div class="acts">${loose ? `<button class="solid" data-loose="${m.id}">Bekijken</button>` : r ? `<button class="solid" data-open="${m.recipe_id}">Openen</button>` : ""}<button data-swap="${m.id}">Wisselen</button><button data-rm="${m.id}">Verwijderen</button></div>
    </div>`;
  };
  // Lijst onder de dagkaart: de overige dagen van deze week vanaf vandaag; is de week (bijna) om, dan volgende week erbij
  let rows = days.filter((x) => x.iso !== sel.iso && (S.menuWeek !== 0 || x.iso >= today));
  let nextRows = [];
  if (S.menuWeek === 0 && rows.length === 0) nextRows = mkDays(addDays(ws, 7));
  const rowHTML = (x) => { const ms = mealsOf(x.iso); return `<button class="wrow${ms.length ? "" : " empty"}" data-day="${x.iso}" data-week="${x.iso > isoDate(we) ? 1 : 0}"><small>${x.ab}</small><span>${ms.length ? esc(ms.map(titleOf).join(" + ")) : "+ Gerecht kiezen"}</span></button>`; };
  const sr = shopRange();
  const listCount = S.meals.filter((m) => m.plan_date >= isoDate(planToday())).length;
  const listLabel = "gepland vanaf vandaag";
  $("#app").innerHTML = `
    <header class="stack" style="gap:14px;padding-top:12px">
      <div class="wk-head"><div><h1>Planning</h1><p>Week ${weekNumber(ws)} · ${label} · ${fmtDay(ws)} – ${fmtDay(we)}</p></div>
        <div class="arrows"><button class="iconbtn" id="prev-week" aria-label="Vorige week" ${S.menuWeek <= -1 ? "disabled" : ""}>${ICON.back}</button><button class="iconbtn flip" id="next-week" aria-label="Volgende week" ${S.menuWeek >= 1 ? "disabled" : ""}>${ICON.back}</button></div></div>
      ${planPartners().length ? `<div class="plan-with">${[S.user.id, ...planPartners()].map((id) => avatarHTML(id, 26)).join("")}<span>${esc(planWithText())}</span></div>` : ""}
      <div id="plan-banners">${planRequestBanner()}</div>
      <div class="strip" id="strip" role="group" aria-label="Dagen van week ${weekNumber(ws)}">${days.map((x) => `<button data-day="${x.iso}" aria-pressed="${x.iso === sel.iso}" aria-label="${x.name} ${fmtDay(x.d)}" class="${mealsOf(x.iso).length ? "has" : ""}${x.iso < today ? " past" : ""}${x.iso === today ? " is-today" : ""}"><small>${x.ab}</small><b>${x.d.getDate()}</b><i aria-hidden="true"></i></button>`).join("")}</div>
      ${S.menuWeek !== 0 ? `<button class="more-meal" id="to-today" style="margin:-8px 0">Terug naar deze week</button>` : ""}
    </header>
    <main class="stack days" style="gap:14px;margin-top:14px">
      <section class="daycard">
        <div class="hd"><h2>${esc(longDate[0].toUpperCase() + longDate.slice(1))}</h2>${sel.iso === today ? `<span class="now-badge">Vandaag</span>` : sel.iso < today ? `<span class="muted" style="font-size:13px;font-weight:600">Geweest</span>` : ""}</div>
        ${selMeals.length ? selMeals.map(mealHTML).join("") + `<button class="more-meal" data-add="${sel.iso}">+ Nog een gerecht</button>`
          : `<div class="dempty"><span>Nog niets gepland.</span><button class="btn primary" data-add="${sel.iso}">Kies een gerecht</button></div>`}
      </section>
      ${rows.length ? `<div class="wrows">${rows.map(rowHTML).join("")}</div>` : ""}
      ${nextRows.length ? `<p class="label" style="margin:4px 0 -8px">Volgende week · week ${weekNumber(addDays(ws, 7))}</p><div class="wrows">${nextRows.map(rowHTML).join("")}</div>` : ""}
      <div class="wk-foot">
        ${updatedHTML()}
        <span>${planPartners().length ? `Deze planning, de boodschappenlijst en de favorieten deel je met ${esc(planPartners().map(nameOf).join(", "))}.` : "Je planning is van jou alleen. Een huishouden vormen doe je bij Instellingen."} Je ziet vorige week, deze week en volgende week.</span>
        ${future.length ? `<button class="linkbtn" id="menu-clear">Alles vanaf vandaag leegmaken</button>` : ""}
      </div>
      <div style="height:80px"></div>
    </main>
    <div class="listbar"><span>${listCount} ${listCount === 1 ? "gerecht" : "gerechten"} ${listLabel}</span><button id="make-list" ${listCount ? "" : "disabled"}>Maak boodschappenlijst</button></div>
    ${tabBarHTML("menu")}`;
  bindTabBar();
  const shift = (n) => { const w = Math.max(-1, Math.min(1, S.menuWeek + n)); if (w === S.menuWeek) return; S.menuWeek = w; S.menuSel = null; drawMenu(); };
  $("#prev-week").onclick = () => shift(-1);
  $("#next-week").onclick = () => shift(1);
  // Vegen over de dagen: naar een andere week
  const strip = $("#strip");
  let x0 = null;
  strip.addEventListener("touchstart", (e) => { x0 = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
  strip.addEventListener("touchend", (e) => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50) shift(dx < 0 ? 1 : -1); });
  const tt = $("#to-today"); if (tt) tt.onclick = () => { S.menuWeek = 0; S.menuSel = today; drawMenu(); };
  $("#plan-banners").onclick = (e) => handlePlanBanner(e, async () => { await loadWeek(); drawMenu(); });
  strip.onclick = (e) => { const b = e.target.closest("[data-day]"); if (!b) return; S.menuSel = b.dataset.day; drawMenu(); };
  $(".days").onclick = async (e) => {
    const t = e.target.closest("button"); if (!t) return;
    try {
      if (t.dataset.day) { if (t.dataset.week === "1") S.menuWeek += 1; S.menuSel = t.dataset.day; drawMenu(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
      if (t.dataset.add) return pickRecipeSheet(t.dataset.add);
      if (t.dataset.loose) return looseMealSheet(S.meals.find((x) => x.id === t.dataset.loose));
      if (t.dataset.swap) { S.swapMeal = t.dataset.swap; return pickRecipeSheet(sel.iso); }
      if (t.dataset.open) { S.detailList = [...new Set(S.meals.filter((m) => m.plan_date >= today).sort((a, b) => a.plan_date.localeCompare(b.plan_date)).map((m) => m.recipe_id).filter((id) => id && getRecipe(id)))]; return getRecipe(t.dataset.open) && go("detail", t.dataset.open); }
      const id = t.dataset.inc || t.dataset.dec || t.dataset.rm;
      const m = S.meals.find((x) => x.id === id); if (!m) return;
      if (t.dataset.rm) { await store.removeMeal(id); S.meals = S.meals.filter((x) => x.id !== id); toast("Van de planning gehaald"); }
      else { const v = Math.min(20, Math.max(1, m.servings + (t.dataset.inc ? 1 : -1))); if (v === m.servings) return; m.servings = v; await store.updateMeal(id, { servings: v }); }
      drawMenu();
    } catch (err) { toast(err.message); }
  };
  $("#make-list").onclick = () => makeShoppingList();
  const mc = $("#menu-clear"); if (mc) mc.onclick = async () => {
    const others = [...new Set(future.filter((m) => m.user_id && m.user_id !== S.user.id).map((m) => nameOf(m.user_id)))];
    const v = await choiceSheet("Planning leegmaken?",
      `Alle ${future.length} ${future.length === 1 ? "gerecht" : "gerechten"} vanaf vandaag gaan van de planning${others.length ? `, ook wat ${others.join(" en ")} heeft gepland` : ""}. Wat al geweest is en je boodschappenlijst blijven staan.`,
      [{ value: "all", label: "Alles vanaf vandaag leegmaken", sub: `${future.length} ${future.length === 1 ? "gerecht" : "gerechten"}`, danger: true }]);
    if (v !== "all") return;
    try { const ids = future.map((m) => m.id); await store.removeMeals(ids); S.meals = S.meals.filter((m) => !ids.includes(m.id)); drawMenu(); toast("Planning vanaf vandaag is leeggemaakt"); }
    catch (err) { toast(err.message); }
  };
}
// Los gerecht bekijken en aanpassen: tekst, dag, op de lijst, of er een recept van maken
function looseParts(title) { return String(title).split(/,|\+|&|\s+en\s+|\s+met\s+/i).map((x) => x.trim()).filter(Boolean).map((x) => x[0].toUpperCase() + x.slice(1)); }
function looseMealSheet(m) {
  if (!m) return;
  const ws = startOfWeek(new Date(m.plan_date + "T12:00:00"));
  let day = m.plan_date;
  const s = sheet(`<div class="sheet-head"><h2>Los gerecht</h2></div>
    <div class="sheet-scroll">
      <label class="field"><span>Wat eten jullie?</span><textarea class="input" id="lm-title" rows="3">${esc(m.title)}</textarea></label>
      <div class="field"><span>Dag</span><div class="daygrid" id="lm-days">${DAY_NAMES.map((dn, i) => { const d = addDays(ws, i), iso = isoDate(d); return `<button type="button" data-day="${iso}" aria-pressed="${iso === day}"><small>${dn.slice(0, 2)}</small><b>${d.getDate()}</b></button>`; }).join("")}</div></div>
      <button class="btn block" id="lm-list">${ICON.bag}<span>Onderdelen op de boodschappenlijst</span></button>
      ${canEdit() ? `<button class="btn block" id="lm-recipe">${ICON.plus}<span>Maak er een recept van</span></button>` : ""}
    </div>
    <button class="btn primary block" id="lm-save">Opslaan</button>`);
  $("#lm-days", s.el).onclick = (e) => { const b = e.target.closest("[data-day]"); if (!b) return; day = b.dataset.day; for (const x of $("#lm-days", s.el).children) x.setAttribute("aria-pressed", x === b); };
  $("#lm-save", s.el).onclick = async () => {
    const title = $("#lm-title", s.el).value.trim().replace(/\s+/g, " ");
    if (!title) { toast("Vul in wat jullie eten, of haal het gerecht weg met ×"); return; }
    try { await store.updateMeal(m.id, { title, plan_date: day }); Object.assign(m, { title, plan_date: day }); s.close(); drawMenu(); toast("Opgeslagen"); }
    catch (err) { toast(err.message); }
  };
  $("#lm-list", s.el).onclick = async (e) => {
    const parts = looseParts($("#lm-title", s.el).value);
    const k = (n) => norm(n).trim();
    const fresh = parts.filter((x) => !S.shop.some((y) => !y.is_checked && k(y.name) === k(x)));
    try {
      if (fresh.length) S.shop.push(...(await store.addShopping(S.household.id, fresh.map((x) => ({ name: x, amount: null, unit: null, is_manual: true, position: 0 })))));
      e.currentTarget.disabled = true;
      toast(fresh.length ? `${fresh.length} ${fresh.length === 1 ? "ding" : "dingen"} op je lijst gezet` : "Staat al op je lijst");
    } catch (err) { toast(err.message); }
  };
  const mk = $("#lm-recipe", s.el);
  if (mk) mk.onclick = () => {
    const title = $("#lm-title", s.el).value.trim();
    s.close();
    S.draft = { ...emptyDraft(), title, ingredients: looseParts(title).map((x) => ({ name: x, amount: null, unit: "", original_text: "", is_pantry: isPantry(x) })), warnings: ["Vul hoeveelheden en de bereiding aan. Het losse gerecht blijft op de planning staan."] };
    S.view = "edit"; render(); window.scrollTo(0, 0);
  };
}
function pickRecipeSheet(date) {
  const swap = S.swapMeal; S.swapMeal = null;
  const d = new Date(date + "T12:00:00");
  const sorted = S.recipes.slice().sort((a, b) => (S.favs.has(b.id) - S.favs.has(a.id)) || a.title.localeCompare(b.title, "nl"));
  const s = sheet(`
    <div class="sheet-head"><h2>${DAY_NAMES[(d.getDay() + 6) % 7]} ${fmtDay(d)}</h2></div>
    <form class="loose" id="loose-form">
      <b style="font-size:15px">Simpel gerecht, zonder recept</b>
      <div class="row2"><input class="input" id="loose-q" placeholder="Bijv. aardappels, kipfilet, broccoli" autocomplete="off" enterkeyhint="done"><button class="btn primary">Zet erop</button></div>
      <label class="check-line"><input type="checkbox" id="loose-list"> Ook op de boodschappenlijst zetten</label>
    </form>
    <p class="label" style="margin:2px 0 -4px">Of kies een recept</p>
    <label class="search">${ICON.search}<input id="pick-q" type="search" placeholder="Zoek een recept" autocomplete="off"></label>
    <div class="opts" id="pick-list"></div>`);
  $("#loose-form", s.el).onsubmit = async (e) => {
    e.preventDefault();
    const title = $("#loose-q", s.el).value.trim().replace(/\s+/g, " ");
    if (!title) { $("#loose-q", s.el).focus(); return; }
    const nice = title[0].toUpperCase() + title.slice(1);
    try {
      const m = await store.addMeal(S.household.id, date, null, 2, nice);
      let added = 0;
      if ($("#loose-list", s.el).checked) {
        const parts = nice.split(/,|\+|&|\s+en\s+|\s+met\s+/i).map((x) => x.trim()).filter(Boolean);
        const k = (n) => norm(n).trim();
        const fresh = parts.filter((x) => !S.shop.some((y) => !y.is_checked && k(y.name) === k(x)));
        if (fresh.length) S.shop.push(...(await store.addShopping(S.household.id, fresh.map((x) => ({ name: x[0].toUpperCase() + x.slice(1), amount: null, unit: null, is_manual: true, position: 0 })))));
        added = fresh.length;
      }
      s.close();
      await noteMeal(m, swap);
      const dn = DAY_NAMES[(d.getDay() + 6) % 7].toLowerCase();
      toast(added ? `Op ${dn} gezet, ${added} ${added === 1 ? "ding" : "dingen"} op je lijst` : `Op ${dn} gezet`);
    } catch (err) { toast(err.message); }
  };
  const draw = () => {
    const q = norm($("#pick-q", s.el).value);
    const list = sorted.filter((r) => !q || norm(r.title + " " + (r.subtitle || "")).includes(q));
    $("#pick-list", s.el).innerHTML = list.length ? list.map((r) => `<button class="pick" data-id="${r.id}">${miniThumb(r)}<span><b>${esc(r.title)}</b><small class="muted">${r.prep_time_minutes ? r.prep_time_minutes + " min · " : ""}${r.servings}p</small></span>${S.favs.has(r.id) ? `<span class="pick-star">${ICON.star}</span>` : ""}</button>`).join("")
      : `<p class="muted">Geen recepten gevonden.</p>`;
  };
  draw();
  $("#pick-q", s.el).oninput = draw;
  addClear($("#pick-q", s.el));
  $("#pick-list", s.el).onclick = async (e) => {
    const b = e.target.closest(".pick"); if (!b) return;
    const r = getRecipe(b.dataset.id);
    try {
      const m = await store.addMeal(S.household.id, date, r.id, r.servings || 2);
      s.close();
      await noteMeal(m, swap);
      toast(`${r.title} staat op ${DAY_NAMES[(d.getDay() + 6) % 7].toLowerCase()}`);
    } catch (err) { toast(err.message); }
  };
}
function addToMenuSheet(r, withList = false) {
  const start = new Date();
  const days = Array.from({ length: 14 }, (_, i) => addDays(start, i));
  let servings = r.servings || 2;
  let chosen = isoDate(days[0]);
  const s = sheet(`
    <div class="sheet-head"><h2>${withList ? "Op de planning en boodschappenlijst" : "Op de planning"}</h2></div>
    <p class="muted" style="margin:-6px 0 0">${esc(r.title)}</p>
    <div class="daygrid" id="daygrid">${days.map((d, i) => `<button data-day="${isoDate(d)}" aria-pressed="${i === 0}"><small>${i === 0 ? "Vandaag" : i === 1 ? "Morgen" : DAY_NAMES[(d.getDay() + 6) % 7].slice(0, 2)}</small><b>${d.getDate()}</b></button>`).join("")}</div>
    <div class="section-head"><span style="font-weight:600">Personen</span>
      <div class="servings"><button id="m-minus" aria-label="Minder personen">−</button><output id="m-pp">${servings} pers.</output><button id="m-plus" aria-label="Meer personen">+</button></div></div>
    ${withList ? `<p class="muted" style="margin:0;font-size:14px">De ingrediënten komen omgerekend op je boodschappenlijst. Dingen uit de voorraadkast niet: die kun je los toevoegen.</p>` : ""}
    <button class="btn primary block" id="m-add">${withList ? "Zet op de planning en lijst" : "Zet op de planning"}</button>`);
  $("#daygrid", s.el).onclick = (e) => {
    const b = e.target.closest("[data-day]"); if (!b) return;
    chosen = b.dataset.day;
    for (const x of $("#daygrid", s.el).children) x.setAttribute("aria-pressed", x === b);
  };
  const upd = () => { $("#m-pp", s.el).textContent = `${servings} pers.`; };
  $("#m-minus", s.el).onclick = () => { if (servings > 1) { servings--; upd(); } };
  $("#m-plus", s.el).onclick = () => { if (servings < 20) { servings++; upd(); } };
  $("#m-add", s.el).onclick = async () => {
    try {
      const m = await store.addMeal(S.household.id, chosen, r.id, servings);
      if (m) await noteMeal(m);
      let added = 0;
      if (withList) added = await addRecipeToList(r, servings);
      s.close();
      const d = new Date(chosen + "T12:00:00");
      const day = `${DAY_NAMES[(d.getDay() + 6) % 7].toLowerCase()} ${d.getDate()}`;
      toast(withList ? `Op de planning voor ${day}, ${added} ${added === 1 ? "product" : "producten"} op je lijst` : `Op de planning voor ${day}`);
    } catch (err) { toast(err.message); }
  };
}

/* ================= Boodschappen ================= */
// Zet de ingrediënten van één recept op de lijst en tel ze op bij wat er al uit het weekmenu op staat
async function addRecipeToList(r, servings) {
  const items = aggregate([{ recipe_id: r.id, servings }]);
  S.shop = await store.shopping();
  const key = (n, u) => shopKey(n) + "|" + shopUnit(u);
  const fresh = [];
  for (const it of items) {
    const ex = S.shop.find((x) => !x.is_checked && !x.is_manual && key(x.name, x.unit) === key(it.name, it.unit));
    if (ex && ex.amount != null && it.amount != null) {
      ex.amount = Math.round((ex.amount + it.amount) * 1000) / 1000;
      await store.updateShopping(ex.id, { amount: ex.amount });
    } else if (!ex) fresh.push({ name: it.name, amount: it.amount == null ? null : Math.round(it.amount * 1000) / 1000, unit: it.unit, is_manual: false, position: 0 });
  }
  if (fresh.length) S.shop.push(...(await store.addShopping(S.household.id, fresh)));
  return items.length;
}

function aisleOf(name) {

}

function groupAisle(g) {

/* ================= Boodschappen samenvoegen: Ei, Eieren en "Parmezaanse kaas (optioneel)" zijn hetzelfde product ================= */
const SHOP_IRREG = { eieren: "ei", eitjes: "ei", eitje: "ei" };
function shopStem(w, keepEn) {
  if (SHOP_IRREG[w]) return SHOP_IRREG[w];
  let x = w.replace(/'s$/, "");
  if (!keepEn && x.length > 3 && /en$/.test(x)) x = x.slice(0, -2);
  else if (x.length > 3 && /s$/.test(x) && !/ss$/.test(x)) x = x.slice(0, -1);
  x = x.replace(/([aeou])\1([^aeiou])$/, "$1$2");   // tomaat → tomat (zelfde als tomaten → tomat)
  x = x.replace(/([^aeiou])\1$/, "$1");             // kippen → kipp → kip
  return x;
}
function shopKey(name, keepEn) {
  const n = norm(name).replace(/\([^)]*\)/g, " ").replace(/\b(optioneel|naar smaak|eventueel|evt\.?)\b/g, " ")
    .replace(/[,;:].*$/, "").replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
  return n.split(" ").filter(Boolean).map((w) => shopStem(w, keepEn)).join(" ");
}
// Losse aantallen (zonder eenheid) en "stuk(s)" tellen we bij elkaar op
function shopUnit(u) { const x = (u || "").trim().toLowerCase(); const n = UNIT_NORM[x] || x; return n === "stuk" || n === "st" || n === "" ? "#" : n; }
function shopName(items) {
  // Kies de duidelijkste naam: zonder haakjes of "optioneel", bij gelijkspel de langste (Eieren boven Ei)
  const clean = (n) => String(n).replace(/\s*\([^)]*\)\s*/g, " ").replace(/\b(optioneel|naar smaak)\b/gi, "").replace(/\s+/g, " ").trim();
  const names = items.map((i) => clean(i.name)).filter(Boolean);
  names.sort((a, b) => b.length - a.length);
  return names[0] || items[0].name;
}
function shopAmount(items) {
  const by = new Map();
  for (const i of items) {
    if (i.amount == null) { if (i.unit && !by.has("txt:" + i.unit)) by.set("txt:" + i.unit, { txt: i.unit }); continue; }
    const u = shopUnit(i.unit);
    const cur = by.get(u) || { amount: 0, unit: u === "#" ? (/stuk/i.test(i.unit || "") ? "stuk" : "") : (UNIT_NORM[(i.unit || "").toLowerCase()] || i.unit) };
    cur.amount += i.amount; if (u === "#" && /stuk/i.test(i.unit || "")) cur.unit = "stuk";
    by.set(u, cur);
  }
  const parts = [...by.values()].map((v) => v.txt != null ? v.txt : fmtAmount(v.amount, v.unit) + (v.unit ? " " + (v.unit === "stuk" && v.amount > 1 ? "stuks" : v.unit) : ""));
  const nums = parts.filter((p) => /\d|[½⅓⅔¼¾]/.test(p));
  return (nums.length ? nums : parts).join(" + ");
}
// Groepeer regels op de lijst die over hetzelfde product gaan
function groupShop(items) {
  // Twee vormen per naam (met en zonder -en eraf), zodat zowel Ui/Uien als Citroen/Citroenen samenkomen
  const groups = [], byKey = new Map();
  for (const i of items) {
    const keys = [shopKey(i.name), shopKey(i.name, true)].filter(Boolean);
    let g = keys.map((k) => byKey.get(k)).find(Boolean);
    if (!g) { g = []; groups.push(g); }
    g.push(i);
    for (const k of keys) if (!byKey.has(k)) byKey.set(k, g);
  }
  return groups.map((g) => ({ ids: g.map((x) => x.id), items: g, name: shopName(g), amt: shopAmount(g), first: g[0] }));
}
const UNIT_NORM = { gram: "g", gr: "g", stuks: "stuk", "stuk(s)": "stuk", eetlepel: "el", theelepel: "tl", "zakje(s)": "zakje", zakjes: "zakje" };
function aggregate(meals, pantry = false) {
  const map = new Map();
  for (const m of meals) {
    const r = getRecipe(m.recipe_id); if (!r) continue;
    const f = (m.servings || r.servings || 2) / (r.servings || 2);
    for (const i of r.recipe_ingredients) {
      if (!!i.is_pantry !== pantry) continue;
      const unitRaw = (i.unit || "").trim().toLowerCase();
      const unit = UNIT_NORM[unitRaw] || unitRaw;
      const key = shopKey(i.name) + "|" + shopUnit(unit);
      const cur = map.get(key);
      const amt = i.amount == null ? null : i.amount * f;
      if (!cur) map.set(key, { name: shopName([i]), unit: unit || null, amount: amt });
      else if (cur.name.length < shopName([i]).length) cur.name = shopName([i]);
      else if (cur.amount != null && amt != null) cur.amount += amt;
      else if (cur.amount == null && amt != null) cur.amount = amt;
    }
  }
  return [...map.values()].sort((a, b) => a.name.localeCompare(b.name, "nl"));
}

async function makeShoppingList(days, preMeals) {
  if (!days) return pickListDays();
  try {
    const meals = preMeals || (await store.mealPlan(days[0], days[days.length - 1])).filter((m) => days.includes(m.plan_date));
    if (!meals.length) { toast("Op die dagen staat niets op de planning"); return; }
    const items = aggregate(meals);
    try { localStorage.setItem(LIST_DAYS_KEY, JSON.stringify(days)); } catch (_) { /* niet erg */ }
    const current = await store.shopping();
    await store.removeShopping(current.filter((x) => !x.is_manual).map((x) => x.id));
    // Wat je zelf al op de lijst zette (bijv. met +) niet nog een keer toevoegen
    const k = (n) => shopKey(n);
    const manual = new Set(current.filter((x) => x.is_manual && !x.is_checked).map((x) => k(x.name)));
    const skipped = items.filter((i) => manual.has(k(i.name))).length;
    items.splice(0, items.length, ...items.filter((i) => !manual.has(k(i.name))));
    if (skipped) setTimeout(() => toast(`${skipped} ${skipped === 1 ? "product stond" : "producten stonden"} er al op en ${skipped === 1 ? "is" : "zijn"} niet dubbel toegevoegd`), 2700);
    await store.addShopping(S.household.id, items.map((i, k) => ({ name: i.name, amount: i.amount == null ? null : Math.round(i.amount * 1000) / 1000, unit: i.unit, is_manual: false, position: k + 1 })));
    try { await loadPantry(); } catch (_) { /* niet erg */ }
    toast(`Lijst gemaakt: ${items.length} producten uit ${meals.length} ${meals.length === 1 ? "gerecht" : "gerechten"}`);
    go("shop");
  } catch (err) { toast(err.message); }
}

const QTY_UNITS = [["", "geen"], ["stuk", "stuks"], ["g", "g"], ["kg", "kg"], ["ml", "ml"], ["l", "l"], ["pak", "pak"], ["blik", "blik"], ["bos", "bos"], ["zak", "zak"]];

async function saveQty(items, name, { amount: newAmt, unit: newUnit }) {
    if (isOffline() || items.some((i) => String(i.id).startsWith("tmp-"))) { toast("Even wachten tot je weer online bent"); return; }
    const keep = items[0], rest = items.slice(1);
    const patch = { amount: newAmt == null ? null : Math.round(newAmt * 1000) / 1000, unit: newUnit, is_manual: true, name };
    const before = S.shop.slice(), old = { ...keep };
    Object.assign(keep, patch); S.shop = S.shop.filter((x) => !rest.includes(x));
    drawShop(); saveCache();
    try {
      await store.updateShopping(keep.id, patch);
      if (rest.length) await store.removeShopping(rest.map((x) => x.id));
      toast(`${name}: ${shopAmount([keep]) || "zonder hoeveelheid"}`);
    } catch (err) { Object.assign(keep, old); S.shop = before; drawShop(); toast(err.message); }

// De voorraadcheck volgt de dagen die je voor je lijst koos; nog niets gekozen? Dan vandaag plus de boodschappenweek.
const LIST_DAYS_KEY = "receptenboek-lijstdagen";
function listDays() {
  const today = isoDate(planToday());
  let d = [];
  try { d = (JSON.parse(localStorage.getItem(LIST_DAYS_KEY) || "[]") || []).filter((x) => x >= today); } catch (_) { d = []; }
  if (d.length) return d.sort();
  const sr = shopRange(), out = [today];
  for (let x = sr.from; x <= sr.to; x = addDays(x, 1)) if (isoDate(x) !== today) out.push(isoDate(x));
  return out;
}
async function loadPantry() {
  const days = listDays();
  const meals = (await store.mealPlan(days[0], days[days.length - 1])).filter((m) => days.includes(m.plan_date));
  S.shopPantry = aggregate(meals, true);
  S.shopPantryDays = [...new Set(meals.map((m) => m.plan_date))].sort();
}
function pantryDaysLabel() {
  const d = S.shopPantryDays || []; if (!d.length) return "";
  const f = (x) => { const t = new Date(x + "T12:00:00"); return `${DAY_NAMES[(t.getDay() + 6) % 7].slice(0, 2).toLowerCase()} ${fmtDay(t)}`; };
  return d.length === 1 ? f(d[0]) : `${f(d[0])} t/m ${f(d[d.length - 1])}`;
}

/* ================= Beheer (alleen beheerder): overzicht en activiteitenlogboek ================= */
function relTime(iso) {
  const d = new Date(iso), now = new Date(), mins = Math.round((now - d) / 60000);
  if (mins < 1) return "zojuist";
  if (mins < 60) return `${mins} min geleden`;
  const t = d.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
  const days = Math.round((startDay(now) - startDay(d)) / 864e5);
  if (days === 0) return `vandaag ${t}`;
  if (days === 1) return `gisteren ${t}`;
  if (days < 7) return `${d.toLocaleDateString("nl-NL", { weekday: "long" })} ${t}`;
  return fmtDate(iso);
}
function startDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function dayLabel(iso) {
  const d = new Date(iso), days = Math.round((startDay(new Date()) - startDay(d)) / 864e5);
  return days === 0 ? "Vandaag" : days === 1 ? "Gisteren" : d.toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "long" });
}
const ACT_VERB = { insert: "voegde toe", update: "wijzigde", delete: "verwijderde", restore: "zette een eerdere versie terug van", role: "veranderde de rol van" };
function actSentence(e) {
  const who = `<b>${esc(nameOf(e.actor_id))}</b>`, what = `<b>${esc(e.target_label || "")}</b>`;
  if (e.kind === "recipe") return `${who} ${e.action === "insert" ? "voegde" : e.action === "update" ? "wijzigde" : e.action === "delete" ? "verwijderde" : "zette terug:"} ${what}${e.action === "insert" ? " toe" : ""}`;
  if (e.kind === "member") {
    if (e.action === "role") return `${who} maakte ${what} ${esc((ROLE_LABEL[e.after?.role] || "").toLowerCase())}`;
    if (e.action === "insert") return `${what} is lid geworden als ${esc((ROLE_LABEL[e.after?.role] || "").toLowerCase())}`;
    return `${who} haalde ${what} uit het receptenboek`;
  }
  if (e.kind === "invite") return e.action === "insert" ? `${who} nodigde ${what} uit` : `${who} trok de uitnodiging voor ${what} in`;
  if (e.kind === "pantry") return `${who} paste de voorraadkast aan`;
  return `${who} ${ACT_VERB[e.action] || e.action} ${what}`;
}
function actBadge(e) {
  if (e.kind !== "recipe") return "";
  const m = { insert: ["ins", "Nieuw"], update: ["", "Gewijzigd"], delete: ["del", "Verwijderd"], restore: ["res", "Teruggezet"] }[e.action] || ["", ""];
  return `<span class="badge-act ${m[0]}">${m[1]}</span>`;
}
// Verschillen tussen twee versies van een recept, in gewone taal
function recipeDiff(b, a) {
  const out = [];
  const line = (cls, html) => `<div class="diff-line ${cls}">${html}</div>`;
  const chg = (o, n) => `<span class="old">${esc(o ?? "—")}</span><span class="arr">→</span>${esc(n ?? "—")}`;
  const sec = (title, lines) => { if (lines.length) out.push(`<div class="diff-sec"><b>${title}</b>${lines.join("")}</div>`); };
  if (!b || !a) {
    const r = a || b, cls = a ? "add" : "rem";

    box.innerHTML = `<div class="stack" style="gap:10px">
      ${open.length ? open.map(card).join("") : `<div class="empty" style="padding:28px 8px"><p class="muted" style="margin:0">Geen openstaande tips. Iedereen kan een tip geven met het lampje naast het tandwiel.</p></div>`}
      ${done.length ? `<div class="section-head" style="margin-top:12px"><p class="label" style="margin:0">Afgehandeld (${done.length})</p><button class="linkbtn danger-text" id="tips-purge">Alles verwijderen</button></div>${done.map(card).join("")}` : ""}</div>`;
  };
  draw();
  if (fresh.length) { try { await store.setTipStatus(fresh, "gezien"); for (const t of list) if (fresh.includes(t.id)) t.status = "gezien"; } catch (_) { /* volgende keer */ } updateTipDot(); }
  box.onclick = async (e) => {
    const b = e.target.closest("button"); if (!b) return;
    try {
      if (b.id === "tips-purge") {
        const ids = list.filter((t) => t.status === "afgehandeld").map((t) => t.id);
        if (!(await confirmSheet(`${ids.length} afgehandelde ${ids.length === 1 ? "tip" : "tips"} definitief verwijderen? Dit kan niet ongedaan worden gemaakt.`, "Definitief verwijderen"))) return;
        for (const id of ids) await store.deleteTip(id);
        list = list.filter((t) => !ids.includes(t.id)); draw(); toast(`${ids.length} ${ids.length === 1 ? "tip" : "tips"} verwijderd`);
        return;
      }
      if (b.dataset.done || b.dataset.reopen) { const id = b.dataset.done || b.dataset.reopen, st = b.dataset.done ? "afgehandeld" : "gezien"; await store.setTipStatus([id], st); list.find((t) => t.id === id).status = st; draw(); }
      if (b.dataset.del) {
        if (!(await confirmSheet("Deze tip verwijderen?", "Verwijderen"))) return;
        await store.deleteTip(b.dataset.del); list = list.filter((t) => t.id !== b.dataset.del); draw();
      }
    } catch (err) { toast(err.message); }
  };
}

/* ================= Instellingen ================= */
function renderSettings() {
  const myName = S.names[S.user.id] || "";
  S.howto = S.howto || deviceKind();
  $("#app").innerHTML = `
    <div class="back"><button class="iconbtn" id="back" aria-label="Terug">${ICON.back}</button><span class="label">Instellingen</span><span style="width:40px"></span></div>
    <div class="stack">
      <div class="panel">
        <p class="label" style="margin:0">Jouw profiel</p>
        <div class="profile-row">${avatarHTML(S.user.id, 72)}
          <div class="stack" style="gap:8px;flex:1;min-width:0">
            <button class="btn" id="s-emoji">${S.avatars?.[S.user.id]?.emoji ? "Andere emoji" : "Kies je emoji"}</button>
            <p class="muted" style="margin:0;font-size:13px">Zo herkennen anderen jouw recepten en gerechten.</p>
          </div></div>
        <p class="muted" style="margin:0;font-size:14px">Jouw rol: <b>${esc(ROLE_LABEL[S.role] || "")}</b> · ${esc((ROLE_HELP[S.role] || "").toLowerCase())}.</p>
        <form id="name-form" class="stack" style="gap:10px"><label class="field"><span>Jouw naam bij recepten</span><input class="input" id="s-name" value="${esc(myName)}" required></label>
          <button class="btn">Naam opslaan</button></form>
      </div>
      ${howtoPanelHTML()}
      <div class="panel"><p class="label" style="margin:0">Weergave</p>
        <div class="tabs three" role="radiogroup" aria-label="Weergave" id="theme">
          ${[["auto", "Automatisch"], ["light", "Licht"], ["dark", "Donker"]].map(([v, l]) => `<button role="radio" data-theme-opt="${v}" aria-selected="${getTheme() === v}" aria-checked="${getTheme() === v}">${l}</button>`).join("")}
        </div>
        <p class="muted" style="margin:0;font-size:14px">Automatisch volgt de instelling van je telefoon. Je keuze wordt op dit toestel onthouden.</p></div>
      <div class="panel" id="plan-panel"><p class="label" style="margin:0">Jouw huishouden</p>
        ${planRequestBanner()}
        ${planPartners().length ? `<div class="plan-with">${[S.user.id, ...planPartners()].map((id) => avatarHTML(id, 30)).join("")}<span>${esc(planWithText())}</span></div>
          <p class="muted" style="margin:0;font-size:14px">Jullie delen de planning, de boodschappenlijst en favorieten, zolang jullie samen een huishouden zijn. Recepten zijn voor het hele receptenboek.</p>
          <button class="btn" id="plan-leave">Huishouden verlaten</button>`
        : `<p class="muted" style="margin:0;font-size:14px">Woon je samen? Vorm een huishouden met iemand uit het receptenboek. Jullie delen dan voor altijd één planning, boodschappenlijst en favorieten. Die persoon moet het eerst accepteren.</p>`}
        <ul class="members">${Object.keys(S.names).filter((id) => id !== S.user.id && S.roles[id] && !planPartners().includes(id) && !((S.plan && S.plan.incoming) || []).includes(id)).sort((a, b) => nameOf(a).localeCompare(nameOf(b), "nl")).map((id) => {
          const pending = ((S.plan && S.plan.outgoing) || []).includes(id);
          return `<li>${avatarHTML(id, 32)}<span>${esc(nameOf(id))}</span><span class="n">${pending ? `<span class="muted">Gevraagd</span> · <button class="linkbtn danger-text" data-cancel="${esc(id)}">Intrekken</button>` : `<button class="linkbtn" data-ask="${esc(id)}">Vraag voor huishouden</button>`}</span></li>`;
        }).join("")}</ul></div>
      ${store.demo ? `<div class="panel"><p class="label" style="margin:0">Alleen in het voorbeeld</p>
        <label class="check-line"><input type="checkbox" id="sim-off" ${S.simOffline ? "checked" : ""}> Doe alsof ik offline ben (bijv. in de supermarkt)</label>
        <p class="muted" style="margin:0;font-size:13px">Vink daarna dingen af op de boodschappenlijst en zet het vinkje hier weer uit.</p>
        <button class="btn" id="sim-update">Toon de melding 'nieuwe versie'</button></div>` : ""}
      ${isAdmin() ? "" : `<p class="muted" style="margin:0 4px;font-size:13px">De beheerder ziet per persoon hoe vaak de app gebruikt wordt: hoeveel recepten je opent en hoeveel je op de planning en de boodschappenlijst zet. Niet welke recepten je bekijkt of wat er op je lijstje staat.</p>`}
      <button class="btn" id="chpw">Wachtwoord wijzigen</button>
      <button class="btn" id="logout">Uitloggen</button>
    </div>`;
  bindHowto();
  $("#chpw").onclick = changePasswordSheet;
  const su = $("#sim-update"); if (su) su.onclick = () => { updateShown = false; showUpdateBar(); };
  const so = $("#sim-off"); if (so) so.onchange = async (e) => { S.simOffline = e.target.checked; if (S.simOffline) goOffline(); else await goOnline(); };
  $("#theme").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    setTheme(b.dataset.themeOpt);
    for (const x of $("#theme").children) { const on = x === b; x.setAttribute("aria-selected", on); x.setAttribute("aria-checked", on); }
  };
  $("#s-emoji").onclick = () => emojiSheet();
  $("#back").onclick = () => go("list");
  $("#plan-panel").onclick = async (e) => {
    if (await handlePlanBanner(e, renderSettings)) return;
    const b = e.target.closest("button"); if (!b) return;
    try {
      if (b.dataset.ask) { await store.requestPlan(b.dataset.ask); toast(`Gevraagd aan ${nameOf(b.dataset.ask)}. Zodra die accepteert, delen jullie een huishouden.`); }
      else if (b.dataset.cancel) { await store.declinePlan(S.user.id, b.dataset.cancel); toast("Verzoek ingetrokken"); }
      else if (b.id === "plan-leave") {
        if (!(await confirmSheet("Het huishouden verlaten? Je neemt je eigen gerechten, boodschappen en favorieten mee.", "Stoppen"))) return;
        await store.leavePlan(); toast("Je hebt het huishouden verlaten");
      } else return;
      S.plan = await store.planInfo(S.user.id); S.favs = new Set(await store.favorites()); renderSettings();
    } catch (err) { toast(err.message); }
  };
  $("#name-form").onsubmit = async (e) => {
    e.preventDefault();
    try { const n = $("#s-name").value.trim(); await store.updateName(S.user.id, n); S.names[S.user.id] = n; toast("Naam opgeslagen"); renderSettings(); }
    catch (err) { toast(err.message); }
  };
  $("#logout").onclick = async () => { await store.signOut(); if (!store.demo) { S.user = null; renderAuth(); } };
}

// Uitnodigingslink: ?code=XXXX invullen bij "Account maken", en de code uit de adresbalk halen
try {
  const c = new URLSearchParams(location.search).get("code");
  if (c) { S.inviteCode = c.trim().toUpperCase(); history.replaceState(null, "", location.pathname + location.hash); }
} catch (_) { /* geen code */ }
if (store.onAuth) store.onAuth((s, ev) => {
  if (ev === "PASSWORD_RECOVERY") { S.user = s?.user || S.user; S.recovery = true; renderNewPassword(); return; }
  if (!s && S.user && !store.demo) { S.user = null; renderAuth(); }
});
boot().catch(renderError);
// App-bestanden op het toestel bewaren, zodat de app ook zonder bereik opent
if ("serviceWorker" in navigator && LIVE && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => { /* zonder offline-opslag verder */ });
</script>

</body>
</html>
